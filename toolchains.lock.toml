# Repository-owned multi-toolchain lock (issue #18).
#
# This file names the toolchain *selectors* LAMINARIA measurements are
# allowed to request. It is not a cache of resolved versions: `doctor`
# (`cargo run -p laminaria-cli -- doctor`) resolves each selector below to an
# exact ToolchainFingerprint (executable path, digest, resolved
# version/commit, bundled LLVM, ...) and records both the selector and the
# resolution together, per docs/multi-version-toolchains.md section 8.
#
# `latest` is never a valid selector value here — see
# docs/measurement-foundation.md section 3.

schema_version = "0.1.0"

# --- Rust -------------------------------------------------------------
#
# Selectors are resolved through `rustup` when available
# (`rustup run <selector> ...`), so multiple exact Rust toolchains can be
# added here and coexist without one overwriting another. Add a new
# `[rust.toolchains.<name>]` entry (and `rustup toolchain install <selector>`)
# for every additional exact stable/beta/nightly/source-built toolchain a
# scenario needs.

[rust.toolchains.system_stable]
selector = "stable"
components = ["rustc", "cargo", "rust-std"]

# --- Nim ----------------------------------------------------------------
#
# Nim 2 and Nimony/Nim 3 share this same named-toolchain abstraction. `bin_dir`
# under `~/.choosenim/toolchains/nim-<selector>/bin` is installed/verified by
# `scripts/bootstrap.sh` through `choosenim` (Nim's rustup-equivalent version
# manager), which is what pins an exact, reproducible Nim version instead of
# depending on whatever a system package manager happened to install:
#
#   [nim.toolchains.nimony_a]
#   selector = "<exact source revision>"
#   bin_dir = "/opt/nimony/<revision>/bin"
#
# Without `bin_dir`, an entry instead names whatever `nim`/`nimble` are
# active on PATH; `doctor` flags a selector/resolved-version mismatch
# explicitly rather than hiding it.

[nim.toolchains.nim2_pinned]
selector = "2.2.10"
bin_dir = "~/.choosenim/toolchains/nim-2.2.10/bin"

# --- Backend / target tools ---------------------------------------------
#
# LLVM/Clang/LLD, the WebAssembly toolchain, and other non-Rust/Nim
# executables consumed by later backend-pipeline research (#13-#17).
# `selector = "system"` means "whatever resolves on PATH"; pin an exact
# version selector once a bootstrap/install path exists for it.

[tools.llvm]
selector = "system"

[tools.clang]
selector = "system"

[tools.lld]
selector = "system"

[tools.wasm_ld]
selector = "system"

[tools.wasm_opt]
selector = "system"

[tools.wasm_tools]
selector = "system"
