      後続実装ステージへ割り当てる、R1/P1/R5対応): 新規 nim-planner/src/fp_report_cli.nim (N1),
      新規crate crates/laminaria-fingerprint-ffi (N2, 既存laminaria-fingerprintを再公開+固定snapshotモード),
      新規 nim-planner/src/schema_compat.nim (N3, schema一致判定とcapability一致判定を別項目として実装),
      新規薄いFFI shim (N4, 既存sha2依存を使った正準化digest計算)。
      各edgeの抽象意味契約(所有・失敗)はspec.md 3.1の表を正とし、
      native C-ABIは#5 T0確定までの参照実装候補として扱う。
    dependency_edges:
      - "N1(Nim CLI) -> N2(Rust lib, 参照実装: native C-ABI)"
      - "N2(Rust lib) -> N3(Nim lib, 参照実装: native C-ABI)"
      - "N3(Nim lib) -> N4(Rust lib, 参照実装: native C-ABI)"
    requested_artifacts: ["N1実行結果(stdout, 終了コード)"]
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work:
      - "panicまたはNim例外がFFI境界を越えてN1プロセス全体を予期しない状態にする(決定的なエラー終了コード以外の挙動)"
      - "by-value集約体・seq/Vec値がいずれかのFFI境界を越える"
      - "schema_versionの一致判定にSemVer範囲互換やDegraded分類を導入する(planFromJsonと同じ厳密文字列一致のみ許可)"
      - "capability集合の一致判定に部分集合(subset)判定を使う(訂正, P1/R3対応: 完全一致(集合の等価性)のみを許可し、部分集合成立での成功を認めない)"
      - "schema_versionの一致判定とcapability集合の一致判定を1つの条件式に混在させる(2つの独立した判定項目として実装する)"
      - "N4を経由しない判定結果がN1へ到達する(装飾的edgeの禁止)"
    required_work:
      - "N3は次の2判定を独立に行う: (判定1)schema_version一致 — 単一文字列の完全一致(contract.nim::PlanSchemaVersionの実際の値'0.2.0'とplanFromJsonと同じ文字列比較)。(判定2)capability集合一致 — requested_capabilitiesとprovided_capabilitiesの集合としての完全一致(要素の過不足なし、部分集合では不可)"
      - "固定snapshot(下記expected参照)で判定1・判定2がともに真のとき終了コード0・Compatible"
      - "判定1が偽(schema_version不一致)のとき終了コード2・構造化エラー(rrkInvalidContractVersion相当)"
      - "判定1が真・判定2が偽(capability集合が完全一致しない)のとき終了コード1・Incompatible診断"
      - "同一固定snapshot入力の2回実行でN4のダイジェストが一致する(決定性)"
    expected:
      kind: value
      value_or_diagnostic: >
        固定snapshot(3系列、D1がこのまま採用する):
        (a) 成功系列: schema_version="0.2.0"(一致), requested_capabilities=["env-fingerprint-v1","toolchain-fingerprint-v1"],
            provided_capabilities=["env-fingerprint-v1","toolchain-fingerprint-v1"](完全一致)
            -> 判定1=真, 判定2=真, exit=0, Compatible。
        (b) capability不一致系列: schema_version="0.2.0"(一致), requested_capabilities=["env-fingerprint-v1","toolchain-fingerprint-v1","unknown-capability-v1"],
            provided_capabilities=["env-fingerprint-v1","toolchain-fingerprint-v1"](部分集合になるが完全一致ではない)
            -> 判定1=真, 判定2=偽, exit=1, Incompatible。
        (c) 不正入力系列: schema_version="0.1.0"(不一致、旧バージョン)
            -> 判定1=偽, exit=2, 構造化エラー。
        正準化書式(N4向け、(a)(b)いずれの判定にも適用、末尾改行なし): "SCHEMA:{schema_version}\nREQ:{req}\nPROV:{prov}\nRESULT:{Compatible|Incompatible}"
        (reqとprovは辞書順ソート後"|"区切り連結)。この書式に対するSHA-256ダイジェストは
        独立実装(Python)で計算し確定済み(本改訂、P2対応、(c)は判定1で拒否されるためN4に到達しない):
        (a)成功系列 -> 9b541417be6e7a89f2cff354eb48574f387c9006ff94e8e182d111653f255b13
        (b)capability不一致系列 -> 2e2d1b0f00b38cc4cb54e37d22d1ee8e96bd5ea4773cc1b25b68a9ac141748d9
        決定性: 同一系列を2回実行したdigest(run1) == digest(run2) == 上記固定値。
      derivation: "判定1はplanning_kernel.nim::planFromJsonの既存厳密一致gate(単一文字列比較)と同一規則。判定2は新規だが同じ厳密一致の考え方を集合へ適用したもの(SemVer範囲・Degradedは導入しない)。N4は既存sha2依存の直接使用"
    subset_scope:
      d1_verifies: >
        D1はこのcase定義(固定snapshot3系列・正準化書式・期待exit code/診断)を確定するのみ。
        N1(fp_report_cli.nim)/N2(laminaria-fingerprint-ffi)/N3(schema_compat.nim)/N4(digest shim)の
        実コード実装、native C-ABIリンクの実現は後続実装ステージへ割り当てる(P1/R5対応、
        本caseはreached_stage: configuration-definitionまでしか到達しない)。
      future_work: ["N1-N4の実コード実装(後続実装ステージ)", "#5 T0確定後の正式target境界選定", "compiler_work_executor統合による並行実行計測"]
    scale: { small: { description: "固定snapshot3系列(成功/capability不一致/schema不一致)" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: []
      cpu_budget: []
      memory_state: [normal]
      cache_state: [cold]
      warmup_runs: 0
      repetitions: 0
      noise_floor: "not-applicable (D1はconfiguration-definition段階、実行計測は後続実装ステージ)"
      reproducibility: "not-applicable (D1では未実装のため)"
    pass_criteria:
