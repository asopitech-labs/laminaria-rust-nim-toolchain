  - id: M4-rust-nim-c-abi-scalar
    pattern: M4
    origin: fixture-existing
    source_layout: "fixtures/rust-nim-c-abi-baseline/{rust-bin,nim-lib}"
    dependency_edges: ["rust-bin -> nim-lib (static link, C-ABI, scalar only)"]
    requested_artifacts: ["rust-bin実行結果(stdout)"]
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work: ["seq/string値がABI境界を越える"]
    required_work: ["laminaria_is_prime等のNim実装関数の呼び出しと結果反映"]
    expected:
      kind: value
      value_or_diagnostic: "既存main.rsの出力（固定入力に対する素数判定/クラスタ統計）"
      derivation: "fixtures/rust-nim-c-abi-baseline/rust-bin/src/main.rs の既存アサーション"
    subset_scope:
      d1_verifies: ["既存fixtureの再実行と結果一致確認、case定義への正式登録"]
      future_work: ["M9実装後、自己構成での同型edgeとの比較"]
    scale: { small: { description: "既存規模そのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: [1]
      cpu_budget: [1]
      memory_state: [normal]
      cache_state: [cold]
      warmup_runs: 1
      repetitions: 3
      noise_floor: "同上"
    pass_criteria:
      d1: "既存アサーションが通過"
      d4: not-applicable-yet

