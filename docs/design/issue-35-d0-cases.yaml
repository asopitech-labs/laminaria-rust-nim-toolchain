  # ---------------------------------------------------------------- M3 ----
  - id: M3-topology
    pattern: M3
    execution_role: bootstrap
    reached_stage: configuration-definition
    origin: self
    refs: []
    source_layout: >
      crates/laminaria-cli の SelfBuild コマンドが構成する PlanningInput
      (crates/laminaria-plan/src/nim_planner_client.rs の sample_input() が実例)。
      compile-rust-host (ActionKind::CargoBuild) と compile-nim-planner
      (ActionKind::NimBuild) は互いのinputs/outputsを参照しない。
    dependency_edges:
      - "integrate -> compile-rust-host (host-bin, ActionKind::CargoBuild)"
      - "integrate -> compile-nim-planner (planner-bin, ActionKind::NimBuild)"
    non_dependency: "compile-rust-host と compile-nim-planner の間に依存なし(ビルド時点で完全独立)"
    requested_artifacts: ["generation-root"]
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work:
      - "compile-rust-host/compile-nim-planner(いずれもCargoBuild/NimBuild)をcompiler_work_executorへ渡す(同executorはUnsupportedActionKindとして拒否する委譲ビルド種別)"
    required_work:
      - "real_planner_binary経由で実際にPlanningInputを計画し、ordered_actionsがintegrateをcompile-rust-host/compile-nim-planner双方より後段に置くことを確認する"
    expected:
      kind: value
      value_or_diagnostic: "ordered_actions が [compile-nim-planner, compile-rust-host, integrate] または [compile-rust-host, compile-nim-planner, integrate] のいずれか(両アクション間に依存が無いため順序は入力側のtie-break規則のみで決まる)、実際の値はcall_planner_against_the_real_binary_produces_a_deterministic_planと同一"
      derivation: "既存の call_planner_against_the_real_binary_produces_a_deterministic_plan テスト(crates/laminaria-plan/src/nim_planner_client.rs)が既に確認済みの実際の挙動"
    subset_scope:
      d1_verifies: ["構成(非依存性)の正当性のみ。並行実行の実測はM3-ownedへ分離"]
      future_work: []
    scale: { small: { description: "既存自己ビルドそのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: []
      cpu_budget: []
      memory_state: [normal]
      cache_state: [cold]
      warmup_runs: 0
      repetitions: 1
      noise_floor: "not-applicable"
      reproducibility: "既存テストの再実行"
    pass_criteria:
      d1: "非依存性が計画結果として実測される。CargoBuild/NimBuildがcompiler_work_executorへ渡されていないことをコードレビューで確認"
      d4: not-applicable-yet

  - id: M3-owned-independent-chains
    pattern: M3
    execution_role: owned
    reached_stage: source-ir-evaluation
    origin: self
    refs: []
    source_layout: >
      crates/laminaria-run/src/compiler_work_executor.rs の既存テスト
      independent_rust_and_nim_chains_agree_across_cpu_budgets_and_run_concurrently_under_budget_two
      (同ファイル1604行目付近)が使う、実Rust source由来チェーンと実Nim
      source由来チェーン。訂正(R1/P2対応): 実コードは各言語チェーンにつき
      LowerSource->ValidateIr->EvaluateEvidenceの3 Action(TransformFunctionは
      含まない)、2言語で合計6 Action(実測: plan.actions.len()==6のassert)。
      前版の「5段(Transform込み)」は別テスト
      (the_full_lower_validate_transform_validate_evaluate_pipeline_runs_end_to_end)
      の記述を誤って混用したもので訂正する。新しいTransform実装・テストの
      追加は行わない(既存3段のみを対象とする)。
    dependency_edges:
      - "rust-chain-validate -> rust-chain-lower"
      - "rust-chain-evaluate -> rust-chain-validate"
      - "nim-chain-validate -> nim-chain-lower"
      - "nim-chain-evaluate -> nim-chain-validate"
    non_dependency: "rust-chain-* と nim-chain-* の間に依存なし(rust-chainとnim-chainは完全に独立な2本の3 Actionチェーン)"
    requested_artifacts: ["rust-chainの最終EvaluateEvidence結果", "nim-chainの最終EvaluateEvidence結果"]
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work:
      - "rust-chainの完了をnim-chainが待つ(またはその逆)"
    required_work:
      - "budget=2でpeak並行度2が実測される(ComputeConcurrencyProbe、opt-in設定で使用)"
      - "budget=1/2で最終結果が一致する"
    expected:
      kind: value
      value_or_diagnostic: "budget1とbudget2で同一の最終EvaluateEvidence結果、budget2でpeak_concurrency==2"
      derivation: "既存テストindependent_rust_and_nim_chains_agree_across_cpu_budgets_and_run_concurrently_under_budget_twoが既に確認済みの実測値(issue#27, commit 3815fb7/b875e43で確定)"
    subset_scope:
      d1_verifies: ["既存テストのcase登録、ScenarioReport形式での計測データ保存"]
      future_work: ["需要駆動実行(D2)との比較"]
    scale: { small: { description: "既存テストそのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: [1, 2]
      cpu_budget: [1, 2]
      memory_state: [normal]
      cache_state: [cold]
      warmup_runs: 1
      repetitions: 5
      noise_floor: "laminaria-run::scenario::NOISE_FLOOR_STDDEV_MULTIPLIER方式"
      reproducibility: "5回の独立した実行間でStats::from_samplesのstddevベース判定を行う。同一reportの自己比較はしない"
      host: "単一の固定host(D1実装者のローカル開発機、またはCIのいずれか一方)で全repetitionを実施する。budget間でhostを変えない"
      state_restoration: "各repetition開始前に新規のArtifactStore/SharedStoreを生成し、前repetitionの状態(store内容、ComputeConcurrencyProbeのカウンタ)を一切引き継がない"
      execution_order: "budget=1で(warmup 1回+本計測5回)を連続実行してから、budget=2で(warmup 1回+本計測5回)を連続実行する。budget間のインターリーブはしない"
      measurement_boundary: "計測開始はrun_compiler_work_plan_traced呼び出し直前、終了は同呼び出しの戻り値受領直後。PlanningInput構築・real_planner_binaryによるplan取得・ArtifactStore初期化は計測区間に含めない(ComputeConcurrencyProbeが計測する実計算区間と開始点を揃える)"
    pass_criteria:
      d1: "budget1/2の結果一致、budget2でpeak_concurrency==2が5回とも再現、ScenarioReportとして保存"
      d4: not-applicable-yet

