# #35 D0 — 機械可読case定義
#
# 対応する設計文書: docs/design/issue-35-d0-spec.md
# 基準commit: b875e43303a7ec9a5215897ed9dd08c98b45c812
#
# schema (docs/design/issue-35-d0-spec.md セクション4.1と同一):
#   id, pattern, origin, source_layout, dependency_edges, requested_artifacts,
#   demand_mode, edit, forbidden_work, required_work, expected, subset_scope,
#   scale, measurement, pass_criteria
#
# 本ファイルは提出時点で「案」であり、指示者の採否記録（issue-35-d0-spec.md
# セクション6）をもって初めて確定する。全case共通で d1_only の値は
# subset_scope.future_work が空でない限り "D1では暫定" として扱う。

schema_version: "0.1.0-draft"

cases:

  # ---------------------------------------------------------------- M1 ----
  - id: M1-fingerprint-fanout
    pattern: M1
    origin: self
    source_layout: >
      crates/laminaria-run/src/bin/{rustc_wrapper.rs,cc_wrapper.rs} の2 [[bin]]、
      および crates/{laminaria-plan,laminaria-run,laminaria-cli} の3 crateが
      いずれも crates/laminaria-fingerprint を直接依存に持つ実ワークスペース。
    dependency_edges:
      - "laminaria-rustc-wrapper -> laminaria-run(lib)"
      - "laminaria-cc-wrapper -> laminaria-run(lib)"
      - "laminaria-plan -> laminaria-fingerprint"
      - "laminaria-run -> laminaria-fingerprint"
      - "laminaria-cli -> laminaria-fingerprint"
    non_dependency: "laminaria-ir と laminaria-fingerprint の間に依存なし"
    requested_artifacts:
      - "target/debug/laminaria"
      - "target/debug/laminaria-rustc-wrapper"
      - "target/debug/laminaria-cc-wrapper"
    demand_mode: full
    edit:
      kind: none
      target: null
    forbidden_work:
      - "fingerprint未変更時に laminaria-fingerprint 自体が再コンパイルされる"
    required_work:
      - "cargo build --workspace が3 binすべてを1回のfingerprintコンパイルで共有する"
    expected:
      kind: diagnostic
      value_or_diagnostic: "cargo build -v の Compiling laminaria-fingerprint が1回のみ出現"
      derivation: "cargo自体の実測ビルドログ（既存ツールの実挙動、LAMINARIA独自コンパイラの主張ではない — bootstrap/delegated-buildベースラインとして記録）"
    subset_scope:
      d1_verifies:
        - "cargo実測ログとの宣言一致"
      future_work:
        - "LAMINARIA自身のplanner/schedulerによる同一グラフの再現（M9実装後）"
    scale:
      small: { description: "既存構成そのまま(5crate+2bin)" }
      medium: null
      large: null
      seed: null
    measurement:
      comparison_modes: [1]
      cpu_budget: [1]
      memory_state: [normal]
      cache_state: [cold, warm]
      warmup_runs: 1
      repetitions: 5
      noise_floor: "laminaria-run::scenario::NOISE_FLOOR_STDDEV_MULTIPLIER方式を流用"
    pass_criteria:
      d1: "forbidden_workがゼロ回、required_workが実測で確認される"
      d4: not-applicable-yet

  - id: M1-fingerprint-leaf-edit
    pattern: M1
    origin: self
    source_layout: "M1-fingerprint-fanoutと同一"
    dependency_edges: "M1-fingerprint-fanoutと同一"
    requested_artifacts: "M1-fingerprint-fanoutと同一"
    demand_mode: full
    edit:
      kind: shared-lib-edit
      target: "crates/laminaria-fingerprint/src/env.rs の1関数本体を1行変更"
    forbidden_work:
      - "laminaria-ir の再コンパイル（fingerprintと無関係）"
    required_work:
      - "laminaria-fingerprint, laminaria-plan, laminaria-run, laminaria-cli の4者すべてが再コンパイルされる"
    expected:
      kind: diagnostic
      value_or_diagnostic: "cargo build -v の Compiling行が上記4crateについてのみ出現、laminaria-ir は Fresh"
      derivation: "incremental-semantic-edit/EDIT.md + STATE-CONTRACTS.md が確立した宣言→実測照合方式の直接適用"
    subset_scope:
      d1_verifies: ["宣言済み再ビルド集合との一致"]
      future_work: ["LAMINARIA独自plannerでの同一invalidation集合の再現"]
    scale: { small: { description: "既存構成そのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: [1]
      cpu_budget: [1]
      memory_state: [normal]
      cache_state: [warm]
      warmup_runs: 1
      repetitions: 3
      noise_floor: "同上"
    pass_criteria:
      d1: "再ビルド集合が期待通り、余分な再ビルドがゼロ"
      d4: not-applicable-yet

  # ---------------------------------------------------------------- M2 ----
  - id: M2-nim-planner-shared-module
    pattern: M2
    origin: self
    source_layout: >
      nim-planner/src/laminaria_planner.nim（本番bin）と
      nim-planner/tests/test_planning_kernel.nim（unittest bin）が
      ともに nim-planner/src/{contract,planning_kernel}.nim を import する。
    dependency_edges:
      - "laminaria_planner.nim -> contract.nim"
      - "laminaria_planner.nim -> planning_kernel.nim"
      - "test_planning_kernel.nim -> contract.nim"
      - "test_planning_kernel.nim -> planning_kernel.nim"
    requested_artifacts:
      - "nim-planner/bin/laminaria-planner"
      - "nim-planner/bin/test_planning_kernel"
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work: []
    required_work:
      - "両binがplanning_kernel.plan/findCycleの同一実装を呼び出す（コピーではない）"
    expected:
      kind: diagnostic
      value_or_diagnostic: "同一PlanningInputに対しplanning_kernel.plan(...)の戻り値が両bin経由で一致する"
      derivation: "既存の real_planner_binary テスト（crates/laminaria-plan/src/nim_planner_client.rs）が同種の決定性を既に検証している方式の踏襲"
    subset_scope:
      d1_verifies: ["2 nim binaryが実際に同一moduleをimportしていることのソース確認、決定性テスト"]
      future_work: ["指示者が付録A代替案を選んだ場合、fixtures/nim-heavy-workspaceへの第2bin追加に差し替え"]
    scale: { small: { description: "既存構成そのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: [1]
      cpu_budget: [1]
      memory_state: [normal]
      cache_state: [cold, warm]
      warmup_runs: 1
      repetitions: 3
      noise_floor: "同上"
    pass_criteria:
      d1: "決定性テストが通過し、指示者が付録A分岐を確定していること"
      d4: not-applicable-yet

  # ---------------------------------------------------------------- M3 ----
  - id: M3-self-build-independent-groups
    pattern: M3
    origin: self
    source_layout: >
      crates/laminaria-cli の SelfBuild コマンドが構成する PlanningInput
      （crates/laminaria-plan/src/nim_planner_client.rs の sample_input() が実例）。
      compile-rust-host (ActionKind::CargoBuild) と compile-nim-planner
      (ActionKind::NimBuild) は互いのinputs/outputsを参照しない。
    dependency_edges:
      - "integrate -> compile-rust-host (host-bin)"
      - "integrate -> compile-nim-planner (planner-bin)"
    non_dependency: "compile-rust-host と compile-nim-planner の間に依存なし（ビルド時点で完全独立）"
    requested_artifacts: ["generation-root"]
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work:
      - "compile-rust-host の完了を compile-nim-planner が待つ（またはその逆）"
    required_work:
      - "両アクションが並行に実行可能であること（実測でoverlapがあること）"
    expected:
      kind: value
      value_or_diagnostic: "ordered_actions が [compile-nim-planner, compile-rust-host, integrate] のいずれの順でも受理される（依存が無いため順序は入力側のtie-break規則のみで決まる）"
      derivation: "nim_planner_client.rs の call_planner_against_the_real_binary_produces_a_deterministic_plan テストが既に確認済みの実際の挙動"
    subset_scope:
      d1_verifies: ["真の非依存性の実測確認（compiler_work_executorのCPU budget>=2での並行dispatch実測）"]
      future_work: ["需要駆動実行への統合（D2）"]
    scale: { small: { description: "既存自己ビルドそのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: [1, 2]
      cpu_budget: [1, 2]
      memory_state: [normal]
      cache_state: [cold]
      warmup_runs: 1
      repetitions: 5
      noise_floor: "同上、加えて issue#27 の ComputeConcurrencyProbe 方式（実計算区間のみのpeak並行度計測）を流用"
    pass_criteria:
      d1: "budget=2でpeak並行度2が実測される（issue#27と同一の検証済み方式）"
      d4: not-applicable-yet

