# #35 D0 — 機械可読case定義（改訂版、R1〜R5対応）
#
# 対応する設計文書: docs/design/issue-35-d0-spec.md
# 基準commit: b875e43303a7ec9a5215897ed9dd08c98b45c812
# 審査記録: issue-35-d0-spec.md セクション6（審査commit 443b5f2、判定revision issue35-d0-review-443b5f2-v1）
#
# schema (docs/design/issue-35-d0-spec.md セクション4.1と同一):
#   id, pattern, execution_role, reached_stage, origin, refs, source_layout,
#   dependency_edges, requested_artifacts, demand_mode, edit, forbidden_work,
#   required_work, expected, subset_scope, scale, measurement, pass_criteria
#
# execution_role:
#   owned      — LAMINARIA自身のIR/scheduler(compiler_work_executor)が実際に計算・実行する経路の証拠
#   reference  — 既存ツール(Cargo/Nimコンパイラ等)の実挙動を観測する証拠。独自経路の達成を意味しない
#   bootstrap  — 自己ビルド等、外部ツールでLAMINARIA自身の実行体を組み立てる経路の証拠
#
# reached_stage: configuration-definition | source-ir-evaluation | target-generation-execution
# origin: self | fixture-existing | fixture-new | self-planned
#   self-planned — M9/M10のように自身が将来持つべき機能として計画されたnode構成（未実装）
#
# refs: 値・入力を共有する他caseへの明示参照。"同上"のような曖昧な再利用は使わない。

schema_version: "0.2.0-draft"

cases:

  # ---------------------------------------------------------------- M1 ----
  - id: M1-fingerprint-cold
    pattern: M1
    execution_role: reference
    reached_stage: target-generation-execution
    origin: self
    refs: []
    source_layout: >
      crates/laminaria-run/src/bin/{rustc_wrapper.rs,cc_wrapper.rs} の2 [[bin]]、
      および crates/{laminaria-plan,laminaria-run,laminaria-cli} の3 crateが
      いずれも crates/laminaria-fingerprint を直接依存に持つ実ワークスペース。
    dependency_edges:
      - "laminaria-rustc-wrapper -> laminaria-run(lib)"
      - "laminaria-cc-wrapper -> laminaria-run(lib)"
      - "laminaria-plan -> laminaria-fingerprint"
      - "laminaria-run -> laminaria-fingerprint"
      - "laminaria-cli -> laminaria-fingerprint"
      - "laminaria-cli -> laminaria-run"
      - "laminaria-cli -> laminaria-plan"
    non_dependency: "laminaria-ir と laminaria-fingerprint の間に依存なし"
    requested_artifacts:
      - "target/debug/laminaria"
      - "target/debug/laminaria-rustc-wrapper"
      - "target/debug/laminaria-cc-wrapper"
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work: []
    required_work:
      - "cargo build --workspace (target/ 削除後の初回ビルド) が laminaria-fingerprint を1回だけコンパイルし、laminaria-rustc-wrapper/laminaria-cc-wrapper/laminariaの3 binすべてで共有する"
    expected:
      kind: diagnostic
      value_or_diagnostic: "cargo build -v の Compiling laminaria-fingerprint が1回のみ出現"
      derivation: "cargo自体の実測ビルドログ(reference role, LAMINARIA独自コンパイラの主張ではない)"
    subset_scope:
      d1_verifies: ["cargo実測ログとの宣言一致"]
      future_work: ["owned schedulerによる同一グラフの再現(M9実装後)"]
    scale: { small: { description: "既存構成そのまま(5crate+2bin)" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: []
      cpu_budget: []
      memory_state: [normal]
      cache_state: [cold]
      warmup_runs: 0
      repetitions: 3
      noise_floor: "not-applicable (reference role, 正当性判定のみ)"
      reproducibility: "3回の独立したtarget/削除→再ビルドで同一ログパターンを確認する"
    pass_criteria:
      d1: "Compiling laminaria-fingerprintが厳密に1回、3回とも再現"
      d4: not-applicable-yet

