  # ---------------------------------------------------------------- M6 ----
  - id: M6-diamond-fingerprint-plan
    pattern: M6
    origin: self
    source_layout: >
      laminaria-fingerprint(producer) <- laminaria-plan, laminaria-run, laminaria-cli(3独立consumer);
      さらに laminaria-plan(producer) <- laminaria-run, laminaria-cli(2独立consumer)という入れ子diamond。
    dependency_edges:
      - "laminaria-plan -> laminaria-fingerprint"
      - "laminaria-run -> laminaria-fingerprint"
      - "laminaria-cli -> laminaria-fingerprint"
      - "laminaria-run -> laminaria-plan"
      - "laminaria-cli -> laminaria-plan"
    requested_artifacts: ["target/debug/laminaria"]
    demand_mode: full
    edit:
      kind: shared-lib-edit
      target: "crates/laminaria-fingerprint/src/types.rs の1フィールド追加"
    forbidden_work:
      - "laminaria-fingerprintが複数回コンパイルされる（重複要求の非合流）"
    required_work:
      - "laminaria-fingerprintの変更がlaminaria-plan経由とlaminaria-run経由の両方に正しく伝播する"
    expected:
      kind: diagnostic
      value_or_diagnostic: "cargo build -v で laminaria-fingerprint の Compiling が1回のみ、laminaria-plan/laminaria-run/laminaria-cliが全て再コンパイルされる"
      derivation: "cargoの実測ビルドログ（bootstrap/delegated-buildベースライン）"
    subset_scope:
      d1_verifies: ["宣言済みcompile回数・伝播集合との実測一致"]
      future_work: ["LAMINARIA独自plannerでの同一挙動の再現、重複semantic keyの合流保証テスト"]
    scale: { small: { description: "既存構成そのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: [1]
      cpu_budget: [1]
      memory_state: [normal]
      cache_state: [warm]
      warmup_runs: 1
      repetitions: 3
      noise_floor: "同上"
    pass_criteria: { d1: "重複コンパイルがゼロ、伝播集合が期待通り", d4: not-applicable-yet }

