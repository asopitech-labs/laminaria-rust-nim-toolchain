  # ---------------------------------------------------------------- M3 ----
  - id: M3-topology
    pattern: M3
    execution_role: bootstrap
    reached_stage: configuration-definition
    origin: self
    refs: []
    source_layout: >
      crates/laminaria-cli の SelfBuild コマンドが構成する PlanningInput
      (crates/laminaria-plan/src/nim_planner_client.rs の sample_input() が実例)。
      compile-rust-host (ActionKind::CargoBuild) と compile-nim-planner
      (ActionKind::NimBuild) は互いのinputs/outputsを参照しない。
    dependency_edges:
      - "integrate -> compile-rust-host (host-bin, ActionKind::CargoBuild)"
      - "integrate -> compile-nim-planner (planner-bin, ActionKind::NimBuild)"
    non_dependency: "compile-rust-host と compile-nim-planner の間に依存なし(ビルド時点で完全独立)"
    requested_artifacts: ["generation-root"]
    demand_mode: full
    edit: { kind: none, target: null }
    forbidden_work:
      - "compile-rust-host/compile-nim-planner(いずれもCargoBuild/NimBuild)をcompiler_work_executorへ渡す(同executorはUnsupportedActionKindとして拒否する委譲ビルド種別)"
    required_work:
      - "real_planner_binary経由で実際にPlanningInputを計画し、ordered_actionsがintegrateをcompile-rust-host/compile-nim-planner双方より後段に置くことを確認する"
    expected:
      kind: value
      value_or_diagnostic: "ordered_actions が [compile-nim-planner, compile-rust-host, integrate] または [compile-rust-host, compile-nim-planner, integrate] のいずれか(両アクション間に依存が無いため順序は入力側のtie-break規則のみで決まる)、実際の値はcall_planner_against_the_real_binary_produces_a_deterministic_planと同一"
      derivation: "既存の call_planner_against_the_real_binary_produces_a_deterministic_plan テスト(crates/laminaria-plan/src/nim_planner_client.rs)が既に確認済みの実際の挙動"
    subset_scope:
      d1_verifies: ["構成(非依存性)の正当性のみ。並行実行の実測はM3-ownedへ分離"]
      future_work: []
    scale: { small: { description: "既存自己ビルドそのまま" }, medium: null, large: null, seed: null }
    measurement:
      comparison_modes: []
      cpu_budget: []
      memory_state: [normal]
      cache_state: [cold]
      warmup_runs: 0
      repetitions: 1
      noise_floor: "not-applicable"
      reproducibility: "既存テストの再実行"
    pass_criteria:
      d1: "非依存性が計画結果として実測される。CargoBuild/NimBuildがcompiler_work_executorへ渡されていないことをコードレビューで確認"
      d4: not-applicable-yet

