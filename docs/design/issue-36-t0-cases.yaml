# #36 T0 — 機械可読case定義（第2版改訂）
#
# 対応する設計文書: docs/design/issue-36-t0-incremental-contract.md
# 基準commit: 1a2e9af
#
# この改訂で修正した7件(レビュー指摘、docs/design/issue-36-t0-incremental-
# contract.md冒頭の「本書は第2版改訂である」参照):
#   1. DependencyDiscovered.new_actions は常に1件以上(旧case2/6/10の
#      矛盾を修正)。
#   2. stale-generation(case6)を実際にstaleにした(先に本物の発見で
#      generationを0->1へ進めてから、generation 0のeventを送る)。
#   3. extends_inputsを撤回し、既存Actionはimmutableのまま、新IDの
#      replacement Action + supersessions で置換する方式にした(fix#3の
#      実例をcase12として新設)。
#   4. StartSession.initial_demandsを追加し、case5の参照カウント2を
#      consumer-a/consumer-bの2件のDemandReferenceから導出できるように
#      した。
#   5. case7/8/11の診断対象(取消後の完了、missing producer)を、
#      StartSessionの初期状態からApplyDeltaでの導入に移した——
#      StartSessionは全caseで単独有効。
#   6. case4を真の完全重複(同一event_id・同一payloadの再送)に修正し、
#      別event_idを持つ内容的重複はcase13へ分離した。
#   7. 全ActionにVcommand_identity/compiler_workを含む完全な記述を与え、
#      artifact idは実際のcompute_artifact_id(FNV-1a、
#      crates/laminaria-plan/src/compiler_work.rs:251-263)をPythonで
#      再実装し、実引数から計算した具体的な値にした(action_catalog参照)。
#
# schema_version: "incremental-planner-protocol/0.1.0" (Command/Response)
#                  "incremental-planning-event/0.1.0" (PlanningEvent)

schema_version: "0.2.0-draft"

# ---------------------------------------------------------------------------
# artifact id の再計算方法(検証はscripts/validate_issue36_t0_cases.pyで
# 自動化する、CI組込)。定数はcompiler_work_executor.rsの実際の呼び出し
# (crates/laminaria-run/src/compiler_work_executor.rs:263-266)と同じ値。
# ---------------------------------------------------------------------------
constants:
  operation_version: "0.1.0"
  subset_version: "0.1.0"
  semantic_contract_version: "0.1.0"
  observation_contract_version: "0.1.0"
  descriptor_schema_version: "0.1.0"   # COMPILER_WORK_SCHEMA_VERSION, compiler_work.rs:29
  budget_token: "budget-1"

fixtures:
  branch_ready:
    rust_source: "fn f(x: i32) -> i32 { x }"
    nim_source: "proc g(x: int32): int32 =\n  x\n"
    test_input: 5
    expected_result: 5
    # fはどの関数も呼ばない -- 閉包は最初から既知、discoveryを経ない。
    # nim_source("g")は本改訂の13caseのいずれからも直接は参照されない
    # (将来のNim側caseのために宣言のみ保持)。
  branch_ready_edited_for_case12:
    # case12専用: branch_readyの"f"が、ソース編集により新たにf_helperを
    # 呼ぶようになった後の版(source-edit-triggered supersessionの実演、
    # docs/design/issue-36-t0-incremental-contract.md §3.4)。
    rust_source: "fn f(x: i32) -> i32 { f_helper(x) }\nfn f_helper(x: i32) -> i32 { x }"
  branch_discovering:
    rust_source_file: "fixtures/laminaria-semantic-substrate-prototype/rust-src/add_or_double.rs"
    initially_requested_functions: ["add_or_double"]
    discovered_closure: ["add_or_double", "double"]
    test_input: { a: 3, b: 4, use_double: 1 }
    expected_result: 6
    derivation: "D0確定済み(issue #35)、crates/laminaria-ir/src/rust_frontend.rs:830-835"

# ---------------------------------------------------------------------------
# artifact id 定義(検証スクリプトが実際に再計算し、下のaction_catalogの
# 値と一致することを確認する——このコメントは人間向けの説明であり、
# 真に唯一の正本はaction_catalog自身の`id`フィールドである)。
# ---------------------------------------------------------------------------
artifact_id_definitions:
  SNAPSHOT_F: 'sha256("fn f(x: i32) -> i32 { x }") = 47ccfa71d2b9d5f65b0991fab8e9bd39e78f4e6fd3d8242e8423f1648939558f'
  SNAPSHOT_F_V2: 'sha256(fixtures.branch_ready_edited_for_case12.rust_source) = 1cd791159ef83c2b14e1e2d749082f867754323ed21bfe6b32a4a6087631face'
  SNAPSHOT_ADD: 'sha256(<contents of fixtures/laminaria-semantic-substrate-prototype/rust-src/add_or_double.rs>) = 48d7eb8a80859d1ee9aae5c455a1505cce82ca3f3b62919a985623e7ef3a2499'
  AID_LOWER_F: 'lower_source_artifact_id("0.1.0", "rust", SNAPSHOT_F, ["f"], "0.1.0") = fb9a5e4882ac44d3'
  AID_VALIDATE_F: 'validate_ir_artifact_id("0.1.0", AID_LOWER_F, "0.1.0") = 3291ecb211f5165c'
  AID_EVIDENCE_F: 'evaluate_evidence_artifact_id("0.1.0", AID_VALIDATE_F, "f", [[5]], "0.1.0") = 346daf22171a2722'
  AID_LOWER_F_V2: 'lower_source_artifact_id("0.1.0", "rust", SNAPSHOT_F_V2, ["f","f_helper"], "0.1.0") = e632c3722565763b'
  AID_DISCOVER_ADD: 'discover_source_dependencies_artifact_id("0.1.0", "rust", SNAPSHOT_ADD, ["add_or_double"], "0.1.0") = 0e788157045cb74a'
  AID_LOWER_ADD: 'lower_source_artifact_id("0.1.0", "rust", SNAPSHOT_ADD, ["add_or_double","double"], "0.1.0") = 95d7231ab054085b'
  AID_VALIDATE_ADD: 'validate_ir_artifact_id("0.1.0", AID_LOWER_ADD, "0.1.0") = eac04bc4907983a3'
  AID_EVIDENCE_ADD: 'evaluate_evidence_artifact_id("0.1.0", AID_VALIDATE_ADD, "add_or_double", [[3,4,1]], "0.1.0") = 4539bb6e4724df6b'
  AID_TRIPLE_VALIDATE: 'validate_ir_artifact_id("0.1.0", "nonexistent-triple-lower-output", "0.1.0") = fb6225c8e90f34e1 -- "nonexistent-triple-lower-output" is a deliberately unresolvable producer id, not a computed value'

