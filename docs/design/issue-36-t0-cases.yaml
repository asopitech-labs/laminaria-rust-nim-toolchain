  # ------------------------------------------------------------ case 4 ----
  - id: T0-incremental-event-reorder-duplicate-delay-stable-result
    purpose: "完全重複(同一event_id・同一payload)の再送と順序入替で最終graphと公開結果が変化しない"
    start_session:
      initial_graph:
        demanded_artifacts: ["fb9a5e4882ac44d3"]
        actions: [*AID_LOWER_F]
      initial_demands: []
    apply_delta_orderings:
      # 同じ3つの論理event(重複evt1/evt1dup は同一event_id・同一payload、
      # 真の完全重複)を3つの異なる到着順で、それぞれ独立したsessionへ
      # 与え、いずれも最終状態が一致することを確認する(fix#6)。
      - name: canonical_order
        events:
          - { command_index: 1, event_id: "T0-case4-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000301, kind: ProducerCompleted, artifact_id: "fb9a5e4882ac44d3", produced_by_action_id: "fb9a5e4882ac44d3" }
          - { command_index: 2, event_id: "T0-case4-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000301, kind: ProducerCompleted, artifact_id: "fb9a5e4882ac44d3", produced_by_action_id: "fb9a5e4882ac44d3" }   # evt1の物理的再送(同一event_id・同一payload)
          - { command_index: 3, event_id: "T0-case4-evt2", sequence_number: 2, planning_generation: 0, emitted_at_unix_ns: 1700000000000000302, kind: DemandRequested, artifact_id: "fb9a5e4882ac44d3", requested_by: "consumer-a" }
      - name: duplicate_first
        events:
          - { command_index: 1, event_id: "T0-case4-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000301, kind: ProducerCompleted, artifact_id: "fb9a5e4882ac44d3", produced_by_action_id: "fb9a5e4882ac44d3" }
          - { command_index: 2, event_id: "T0-case4-evt2", sequence_number: 2, planning_generation: 0, emitted_at_unix_ns: 1700000000000000302, kind: DemandRequested, artifact_id: "fb9a5e4882ac44d3", requested_by: "consumer-a" }
          - { command_index: 3, event_id: "T0-case4-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000301, kind: ProducerCompleted, artifact_id: "fb9a5e4882ac44d3", produced_by_action_id: "fb9a5e4882ac44d3" }   # evt1の遅延再送
      - name: delayed_duplicate_last
        events:
          - { command_index: 1, event_id: "T0-case4-evt2", sequence_number: 2, planning_generation: 0, emitted_at_unix_ns: 1700000000000000302, kind: DemandRequested, artifact_id: "fb9a5e4882ac44d3", requested_by: "consumer-a" }
          - { command_index: 2, event_id: "T0-case4-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000301, kind: ProducerCompleted, artifact_id: "fb9a5e4882ac44d3", produced_by_action_id: "fb9a5e4882ac44d3" }
          - { command_index: 3, event_id: "T0-case4-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000301, kind: ProducerCompleted, artifact_id: "fb9a5e4882ac44d3", produced_by_action_id: "fb9a5e4882ac44d3" }
    expected_graph:
      final: [{ id: "fb9a5e4882ac44d3", state: completed }]
    expected_trace:
      assertion: "3つのordering全てで、最終graphのbyte-for-byte一致(JSON表現の完全一致)を確認する。"
    measurement: {}
    pass_criteria:
      t1: "3通りの到着順(正順・重複先行・遅延重複)すべてで最終公開結果が同一である。evt1の2回目の到着はevent_idの一致により無視される(§7.1)。"

