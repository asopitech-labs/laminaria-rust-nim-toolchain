          diagnostic: null
    expected_state:
      reference_count_for_AID_LOWER_F_fb9a5e4882ac44d3: 0   # 退役、参照カウントは全数移送済み
      reference_count_for_AID_LOWER_F_V2_e632c3722565763b: 1   # consumer-aの分がそのまま移送された
    expected_trace:
      assertion: >-
        fb9a5e4882ac44d3は二度と`ProducerCompleted`/`DemandRequested`等の
        対象にならない(Rust runtimeは以後e632c3722565763bを実行対象と
        する)。fb9a5e4882ac44d3を参照する既存consumerは本caseには存在
        しない(cascade不要な最小構成であることの確認)。
    measurement:
      dynamic_expansion_count_after_evt1: 1
    pass_criteria:
      t1: >-
        意味的入力の変化は既存Actionのin-place書き換えではなく、新IDの
        replacement Action + supersessionsとして導入される。旧Actionは
        退役し、参照カウントは全数新Actionへ移送される。

  # -------------------------------------------- case 13 (内容的冪等性) ----
  - id: T0-incremental-content-idempotent-different-event-id
    purpose: >-
      別々のevent_idを持つ、内容的に同じProducerCompletedが2回届いても
      (event_idベースの重複検出には引っかからない)、状態遷移そのものが
      内容ベースで冪等であるため最終状態は変化しない(fix#6、case4から
      分離した内容的重複)。
    start_session:
      initial_graph:
        demanded_artifacts: ["fb9a5e4882ac44d3"]
        actions: [*AID_LOWER_F]
      initial_demands: []
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case13-evt-retry-a"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000001201
          kind: ProducerCompleted
          artifact_id: "fb9a5e4882ac44d3"
          produced_by_action_id: "fb9a5e4882ac44d3"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "fb9a5e4882ac44d3", from_state: ready, to_state: completed }
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case13-evt-retry-b"   # 独立したretryが発行した、
                                                 # evt-retry-aとは別の
                                                 # event_id -- しかし主張
                                                 # する内容(このartifactは
                                                 # completed)は同一
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000001202
          kind: ProducerCompleted
          artifact_id: "fb9a5e4882ac44d3"
          produced_by_action_id: "fb9a5e4882ac44d3"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions: []   # 既にcompletedのため、状態遷移そのものが
                                  # 内容ベースで冪等(§7.3) -- event_idの
                                  # 重複検出には頼っていない
          diagnostic: null
    expected_trace:
      assertion: >-
        fb9a5e4882ac44d3の状態はevt-retry-aの適用でcompletedになり、
        event_idの異なるevt-retry-bの適用後も引き続きcompletedのまま
        (二重に「完了」した扱いにはならない、エラーにもならない)。
    measurement: {}
    pass_criteria:
      t1: >-
        別のevent_idを持つ、内容的に同一の主張を繰り返し適用しても
        最終状態は変化しない。冪等性はevent_idの一致ではなく状態遷移
        自体の内容に宿る。
