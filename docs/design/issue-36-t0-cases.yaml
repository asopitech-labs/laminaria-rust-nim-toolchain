  # ------------------------------------------------------- case 6 (診断1/5) ----
  - id: T0-incremental-diagnostic-stale-generation
    purpose: "古いgenerationのeventをNimが拒否する(実際にstaleな状態を作ってから確認する)"
    start_session:
      initial_graph:
        demanded_artifacts: ["0e788157045cb74a"]
        actions: [*AID_DISCOVER_ADD]   # 単独有効。generation 0で開始
      initial_demands: []
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case6-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000501
          kind: ProducerCompleted
          artifact_id: "0e788157045cb74a"
          produced_by_action_id: "0e788157045cb74a"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "0e788157045cb74a", from_state: ready, to_state: completed }
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case6-evt2"
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000502
          kind: DependencyDiscovered
          discovering_action_id: "0e788157045cb74a"
          new_actions: [*AID_LOWER_ADD]   # 本物の新規発見。generationが0->1へ進む
          supersessions: []
          new_demands: []
        expected_response:
          kind: PlanDelta
          planning_generation: 1   # ここで現在世代が1になる
          changed_actions:
            - { action_id: "95d7231ab054085b", from_state: null, to_state: ready }
          diagnostic: null
      - command_index: 3
        event:
          event_id: "T0-case6-evt3"
          sequence_number: 3
          planning_generation: 0   # 送信側が"generation 0"時点で組み立てた、
                                    # 既に反映済みの情報(AID_LOWER_ADDは
                                    # 既にevt2でgraphに存在する)を運ぶ、
                                    # 現在世代(1)より古い遅延event
          emitted_at_unix_ns: 1700000000000000503
          kind: DependencyDiscovered
          discovering_action_id: "0e788157045cb74a"
          new_actions: [*AID_LOWER_ADD]   # evt2と全く同じ主張の再送
          supersessions: []
          new_demands: []
        expected_response:
          kind: PlanDelta
          planning_generation: 1   # 変化なし(現在世代のまま)
          changed_actions: []
          diagnostic: stale_generation
    expected_graph:
      after_evt3: [{ id: "95d7231ab054085b", state: ready }]   # 変化なし
    expected_trace:
      assertion: >-
        evt3は自身のplanning_generation(0)が現在世代(1)より古く、かつ
        内容が既に反映済みであるためstale_generationとして拒否され、
        状態遷移は発生しない。evt2自体(本物の発見)は正常に適用され
        generationを進めている——このcaseは「現在世代もevent世代も0の
        まま」という第1改訂の欠陥を修正し、真にstaleな状況を作ってから
        検証する。
    measurement: {}
    pass_criteria:
      t1: >-
        planning_generationが現在より古く、かつ内容が反映済みのevent
        はstale_generationとしてNimに拒否され、graphを変化させない。

  # ------------------------------------------------------- case 7 (診断2/5) ----
  - id: T0-incremental-diagnostic-cancelled-result
    purpose: "取消後に完了した結果を診断する(診断対象はApplyDeltaで初めて発生させる)"
    start_session:
      initial_graph:
        demanded_artifacts: ["346daf22171a2722"]
        actions: [*AID_LOWER_F, *AID_VALIDATE_F, *AID_EVIDENCE_F]   # 単独有効:
                                                                    # 通常のready/
                                                                    # blocked_dependency
                                                                    # 連鎖、参照カウント1
      initial_demands:
        - { artifact_id: "346daf22171a2722", requested_by: "consumer-a" }
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case7-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000601
          kind: DemandCancelled
          artifact_id: "346daf22171a2722"
          requested_by: "consumer-a"
        # Nimの視点では、AID_EVIDENCE_Fはこの時点でまだblocked_dependency
        # (AID_VALIDATE_Fが未完了)であり、参照カウントが0に達したため
        # §6.2の通常規則でblocked_dependency -> cancelledへ直ちに遷移する。
        # ところがRust runtimeは(Nimからは見えないRust側の実行overlayで)
        # 既にAID_LOWER_F/AID_VALIDATE_F/AID_EVIDENCE_Fの実行に着手して
        # おり、この取消はその実行を中断させない(§6.3、非プリエンプション)。
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "346daf22171a2722", from_state: blocked_dependency, to_state: cancelled }
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case7-evt2"
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000602
          kind: ProducerCompleted
          artifact_id: "346daf22171a2722"
          produced_by_action_id: "346daf22171a2722"
        # Rustが既に開始していた実行が、取消の到着後に完了して届く
        # -- AID_EVIDENCE_Fは既にcancelled(終端)なので、この完了は
        # 「結果を記録するが公開しない」cancelled_result診断として扱う。
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "346daf22171a2722", from_state: cancelled, to_state: completed }
          diagnostic: cancelled_result
    expected_graph:
      after_evt2:
        - { id: "346daf22171a2722", state: completed, published: false }
          # ArtifactStoreへは記録するが、公開(demand解決)はしない(§6.3)
    expected_trace:
      assertion: "AID_EVIDENCE_Fの結果はArtifactStoreに保存されるが、どのconsumerへも公開されない。"
    measurement: {}
    pass_criteria:
      t1: >-
        既にcancelledなactionへ遅れて届くProducerCompletedは、完了時に
        cancelled_resultとして記録され、証拠は保持されつつ公開されない
        (黙って破棄しない、黙って公開しない)。診断対象の不正状態は
        StartSessionではなくApplyDelta(evt1のDemandCancelled)によって
        初めて発生する。

