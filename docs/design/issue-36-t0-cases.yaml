          kind: DependencyDiscovered
          discovering_action_id: "0e788157045cb74a"
          new_actions: [*action_x, *action_y]   # action-xはaction-y-outに、
                                                # action-yはaction-x-outに
                                                # 依存する -- この2件だけで
                                                # 閉じたcycle
          supersessions: []
          new_demands: []
        expected_response:
