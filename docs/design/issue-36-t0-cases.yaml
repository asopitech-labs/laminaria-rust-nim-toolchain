# #36 T0 — 機械可読case定義（改訂版）
#
# 対応する設計文書: docs/design/issue-36-t0-incremental-contract.md
# 基準commit: 36ee8a0
#
# 改訂の理由: 初版(基準commit e3b528c)はレビューで5件のP1欠陥を指摘され
# 不採択となった。本改訂は設計文書の全面書き直しに合わせて、本fileも
# 全caseを書き直したものである。主な変更:
#   - branch_discoveringの前提を修正(add_or_doubleだけを先にlowerする
#     という、実際のlower_rust_sourceの前提と矛盾する想定を廃した)。
#   - 全eventにevent_id/sequence_number/planning_generation/
#     emitted_at_unix_nsを完全記述した(宣言schema準拠)。
#   - semantic_keyを廃し、既存の*_artifact_id関数の戻り値をartifact_idと
#     して使う。
#   - DependencyDiscoveredにnew_actions(full Action)/new_demands/
#     extends_inputsを持たせ、「producerを生成できない」欠陥を修正した。
#   - pass_criteria.d1 を pass_criteria.t1 に修正した。
#   - cpu_slot_acquired/cpu_slot_releasedをtraceへ追加した。
#   - 否定case(no-fallback)を追加し、合計11 caseとした。
#   - 各caseは独立したsession(StartSession〜CloseSession)として自己完結
#     させた(前caseの状態を暗黙に引き継がない)。
#
# artifact idの記法: 以下のAID_*は、すべて
# crates/laminaria-plan/src/compiler_work.rs:265-359の実関数を実引数で
# 呼んだ戻り値を指す固定ラベルである(本fileが独自に定義する識別子では
# ない)。関数と実引数の対応は下の `artifact_id_definitions` に明記する。
#
# schema_version: "incremental-planner-protocol/0.1.0" (Command/Response)
#                  "incremental-planning-event/0.1.0" (PlanningEvent)

schema_version: "0.1.0-draft"

fixtures:
  branch_ready:
    rust_source: "fn f(x: i32) -> i32 { x }"
    nim_source: "proc g(x: int32): int32 =\n  x\n"
    expected_rust_result: 5
    expected_nim_result: 5
    test_input: 5
    # fはどの関数も呼ばない -- 閉包は最初から既知、discoveryを経ない。
  branch_discovering:
    rust_source_file: "fixtures/laminaria-semantic-substrate-prototype/rust-src/add_or_double.rs"
    initially_requested_functions: ["add_or_double"]
    discovered_closure: ["add_or_double", "double"]
    test_input: { a: 3, b: 4, use_double: 1 }
    expected_result: 6
    derivation: "D0確定済み(issue #35)、crates/laminaria-ir/src/rust_frontend.rs:830-835"

artifact_id_definitions:
  AID_LOWER_F: 'lower_source_artifact_id("lower_source/0.1.0", "rust", SNAPSHOT_F, ["f"], "declared-subset/0.1.0")'
  AID_VALIDATE_F: 'validate_ir_artifact_id("validate_ir/0.1.0", AID_LOWER_F, "semantic-contract/0.1.0")'
  AID_EVIDENCE_F: 'evaluate_evidence_artifact_id("evaluate_evidence/0.1.0", AID_VALIDATE_F, "f", [[5]], "observation-contract/0.1.0")'
  AID_LOWER_G: 'lower_source_artifact_id("lower_source/0.1.0", "nim", SNAPSHOT_G, ["g"], "declared-subset/0.1.0")'
  AID_VALIDATE_G: 'validate_ir_artifact_id("validate_ir/0.1.0", AID_LOWER_G, "semantic-contract/0.1.0")'
  AID_EVIDENCE_G: 'evaluate_evidence_artifact_id("evaluate_evidence/0.1.0", AID_VALIDATE_G, "g", [[5]], "observation-contract/0.1.0")'
  AID_DISCOVER_ADD: 'discover_source_dependencies_artifact_id("discover_source_dependencies/0.1.0", "rust", SNAPSHOT_ADD, ["add_or_double"], "declared-subset/0.1.0")'
  AID_LOWER_ADD: 'lower_source_artifact_id("lower_source/0.1.0", "rust", SNAPSHOT_ADD, ["add_or_double", "double"], "declared-subset/0.1.0")'
  AID_VALIDATE_ADD: 'validate_ir_artifact_id("validate_ir/0.1.0", AID_LOWER_ADD, "semantic-contract/0.1.0")'
  AID_EVIDENCE_ADD: 'evaluate_evidence_artifact_id("evaluate_evidence/0.1.0", AID_VALIDATE_ADD, "add_or_double", [[3,4,1]], "observation-contract/0.1.0")'
  # SNAPSHOT_F/SNAPSHOT_G/SNAPSHOT_ADD はそれぞれの source_snapshot_id
  # (compute_source_snapshot_id、compiler_work.rs:64-70 のSHA-256)。

cases:
  # ------------------------------------------------------------ case 1 ----
  - id: T0-incremental-ready-branch-proceeds-during-discovery
    purpose: "別枝の依存発見中にready枝が実compiler workを開始する"
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_EVIDENCE_F", "AID_DISCOVER_ADD"]
        actions:
          - { id: "AID_LOWER_F", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_F"] }
          - { id: "AID_VALIDATE_F", kind: ValidateIr, inputs: ["AID_LOWER_F"], outputs: ["AID_VALIDATE_F"] }
          - { id: "AID_EVIDENCE_F", kind: EvaluateEvidence, inputs: ["AID_VALIDATE_F"], outputs: ["AID_EVIDENCE_F"] }
          - { id: "AID_DISCOVER_ADD", kind: DiscoverSourceDependencies, inputs: [], outputs: ["AID_DISCOVER_ADD"] }
      initial_nim_state:
        planning_generation: 0
        graph_states:
          AID_LOWER_F: ready            # inputsなし
          AID_VALIDATE_F: blocked_dependency
          AID_EVIDENCE_F: blocked_dependency
          AID_DISCOVER_ADD: ready       # inputsなし(sourceを直接読む)
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case1-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000001
          kind: ProducerCompleted
          artifact_id: "AID_DISCOVER_ADD"
          produced_by_action_id: "AID_DISCOVER_ADD"
        # Rust runtimeが実際にDiscoverSourceDependencies(構文走査、
        # sleepではない)を実行し終えた結果。出力artifactの中身は
        # 発見された関数名リスト["double"]。
        expected_response:
          kind: PlanDelta
          planning_generation: 0        # ProducerCompletedは増分しない
          changed_actions:
            - { action_id: "AID_DISCOVER_ADD", from_state: ready, to_state: completed }
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case1-evt2"
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000002
          kind: DependencyDiscovered
          discovering_action_id: "AID_DISCOVER_ADD"
          new_actions:
            - { id: "AID_LOWER_ADD", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_ADD"] }
            - { id: "AID_VALIDATE_ADD", kind: ValidateIr, inputs: ["AID_LOWER_ADD"], outputs: ["AID_VALIDATE_ADD"] }
            - { id: "AID_EVIDENCE_ADD", kind: EvaluateEvidence, inputs: ["AID_VALIDATE_ADD"], outputs: ["AID_EVIDENCE_ADD"] }
          new_demands:
            - { artifact_id: "AID_EVIDENCE_ADD", requested_by: "consumer-b" }
          extends_inputs: []
        # add_or_doubleとdoubleを閉じた集合["add_or_double","double"]と
        # して1回のLowerSourceへ渡す(docs/design/issue-36-t0-incremental-
        # contract.md §1.8) -- add-or-double-lowerを別々に2回lowerして
        # 後から結合する、という初版の(誤った)想定はここでは行わない。
        expected_response:
          kind: PlanDelta
          planning_generation: 1        # DependencyDiscoveredで1増分
          changed_actions:
            - { action_id: "AID_LOWER_ADD", from_state: null, to_state: ready }
            - { action_id: "AID_VALIDATE_ADD", from_state: null, to_state: blocked_dependency }
            - { action_id: "AID_EVIDENCE_ADD", from_state: null, to_state: blocked_dependency }
          diagnostic: null
    expected_trace:
      assertion: >-
        AID_LOWER_Fについてcpu_slot_acquiredが記録された時刻は、
        AID_DISCOVER_ADDの完了(evt1)より前であり、かつAID_LOWER_ADDが
        readyになった時刻(evt2の応答時点)より前である -- doubleの発見と
        無関係にf枝が先に実行を開始したことを直接のslot事象で示す。
      time_to_first_useful_work: "AID_LOWER_Fのcpu_slot_acquired時刻(session開始からの経過)"
      cpu_slot_invariant: >-
        任意の時刻において held_slots == running状態のaction数 と一致する
        (docs/design/issue-36-t0-incremental-contract.md §9の不変条件)。
        AID_VALIDATE_F/AID_EVIDENCE_F/AID_VALIDATE_ADD/AID_EVIDENCE_ADDは
        blocked_dependency状態の間、一度もcpu_slot_acquiredを記録しない。
    measurement:
      dynamic_expansion_count_after_evt2: 1
      cpu_budget: 2
    pass_criteria:
      t1: >-
        AID_LOWER_F枝がAID_DISCOVER_ADDの発見処理と独立にready→running
        へ進む。blocked_dependency状態のactionはcpu_slot_acquiredを
        一度も記録しない(trace上のheld_slots不変条件で示す)。

  # ------------------------------------------------------------ case 2 ----
  - id: T0-incremental-late-dependency-single-resume
    purpose: "同一blocking関係の重複した発見通知が二重の待機/再開を起こさない"
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_EVIDENCE_ADD"]
        actions:
          - { id: "AID_LOWER_ADD", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_ADD"] }
          - { id: "AID_VALIDATE_ADD", kind: ValidateIr, inputs: ["AID_LOWER_ADD"], outputs: ["AID_VALIDATE_ADD"] }
          - { id: "AID_EVIDENCE_ADD", kind: EvaluateEvidence, inputs: ["AID_VALIDATE_ADD"], outputs: ["AID_EVIDENCE_ADD"] }
      initial_nim_state:
        planning_generation: 1   # case1相当の発見が既にこのsession開始前に確定済みという設定
        graph_states:
          AID_LOWER_ADD: ready
          AID_VALIDATE_ADD: blocked_dependency   # blocked_on: [AID_LOWER_ADD]
          AID_EVIDENCE_ADD: blocked_dependency
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case2-evt1"
          sequence_number: 1
          planning_generation: 1
          emitted_at_unix_ns: 1700000000000000101
          kind: DependencyDiscovered
          discovering_action_id: "AID_DISCOVER_ADD"
          new_actions: []
          new_demands: []
          extends_inputs:
            - { action_id: "AID_VALIDATE_ADD", added_inputs: ["AID_LOWER_ADD"] }
        # 既にAID_VALIDATE_ADD.inputsに含まれているAID_LOWER_ADDを重複して
        # 追加通知するevent(同じblocking関係の再送、実システムでは
        # スレッドレースや再試行により起こり得る)。blocking集合は
        # 変化しない。
        expected_response:
          kind: PlanDelta
          planning_generation: 1   # 新しい情報を含まないため増分しない
          changed_actions: []
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case2-evt2"
          sequence_number: 2
          planning_generation: 1
          emitted_at_unix_ns: 1700000000000000102
          kind: ProducerCompleted
          artifact_id: "AID_LOWER_ADD"
          produced_by_action_id: "AID_LOWER_ADD"
        expected_response:
          kind: PlanDelta
          planning_generation: 1
          changed_actions:
            - { action_id: "AID_LOWER_ADD", from_state: ready, to_state: completed }
            - { action_id: "AID_VALIDATE_ADD", from_state: blocked_dependency, to_state: ready }
          diagnostic: null
    expected_trace:
      assertion: >-
        AID_VALIDATE_ADDについて blocked_dependency -> ready の遷移が
        正確に1回だけ記録される(evt1はblocking集合を変化させず、状態
        遷移を発生させない)。
      transition_count_blocked_to_ready: 1
    measurement:
      dynamic_expansion_count_after_evt1: 0
    pass_criteria:
      t1: >-
        blocking producer完了時に一度だけready化する。重複した依存発見
        通知が二重の待機/再開を起こさない。

  # ------------------------------------------------------------ case 3 ----
  - id: T0-incremental-semantic-key-merge
    purpose: "同一artifact_id(既存*_artifact_id関数の戻り値)への同時要求が一計算へ合流する"
    start_session:
      initial_graph:
        demanded_artifacts: []
        actions:
          - { id: "AID_LOWER_F", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_F"] }
      initial_nim_state:
        planning_generation: 0
        graph_states:
          AID_LOWER_F: ready
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case3-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000201
          kind: DemandRequested
          artifact_id: "AID_LOWER_F"
          requested_by: "consumer-a"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions: []   # 参照カウントの変化はgraph state遷移ではない
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case3-evt2"
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000202
          kind: DemandRequested
          artifact_id: "AID_LOWER_F"     # consumer-a/consumer-cは異なる
                                          # requested_byだが、artifact_idは
                                          # 同一(同一source_snapshot_id・
                                          # 同一requested_functions・
                                          # 同一language -- §4.4)
          requested_by: "consumer-c"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions: []
          diagnostic: null
    expected_state:
      reference_count_for_AID_LOWER_F: 2
    expected_trace:
      assertion: >-
        AID_LOWER_Fに対応するactionは1つのまま(2つ目のDemandRequestedは
        既存actionの参照カウント+1のみを行い、新規actionを作らない)。
      action_count_for_artifact_id: 1
    measurement:
      dynamic_expansion_count: 0
    pass_criteria:
      t1: >-
        同一artifact_idの2つのDemandRequestedがちょうど1つのactionに
        合流し、参照カウントが2になる。合流キーは新しいハッシュ方式では
        なく、既存のlower_source_artifact_idの戻り値そのものである。

  # ------------------------------------------------------------ case 4 ----
  - id: T0-incremental-event-reorder-duplicate-delay-stable-result
    purpose: "eventの重複・遅延・順序入替で最終graphと公開結果が変化しない"
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_LOWER_F"]
        actions:
          - { id: "AID_LOWER_F", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_F"] }
      initial_nim_state:
        planning_generation: 0
        graph_states:
          AID_LOWER_F: ready
    apply_delta_orderings:
      # 同じ3イベントを3つの異なる到着順で、それぞれ独立したsessionへ与え、
      # いずれも最終状態が一致することを確認する。
      - name: canonical_order
        events:
          - { command_index: 1, event_id: "T0-case4-canonical-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000301, kind: ProducerCompleted, artifact_id: "AID_LOWER_F", produced_by_action_id: "AID_LOWER_F" }
          - { command_index: 2, event_id: "T0-case4-canonical-evt2", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000302, kind: ProducerCompleted, artifact_id: "AID_LOWER_F", produced_by_action_id: "AID_LOWER_F" }   # 重複(同一sequence_number)
          - { command_index: 3, event_id: "T0-case4-canonical-evt3", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000303, kind: DemandRequested, artifact_id: "AID_LOWER_F", requested_by: "consumer-a" }
      - name: duplicate_first
        events:
          - { command_index: 1, event_id: "T0-case4-canonical-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000311, kind: ProducerCompleted, artifact_id: "AID_LOWER_F", produced_by_action_id: "AID_LOWER_F" }
          - { command_index: 2, event_id: "T0-case4-canonical-evt3", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000312, kind: DemandRequested, artifact_id: "AID_LOWER_F", requested_by: "consumer-a" }
          - { command_index: 3, event_id: "T0-case4-canonical-evt2", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000313, kind: ProducerCompleted, artifact_id: "AID_LOWER_F", produced_by_action_id: "AID_LOWER_F" }
      - name: delayed_duplicate_last
        events:
          - { command_index: 1, event_id: "T0-case4-canonical-evt3", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000321, kind: DemandRequested, artifact_id: "AID_LOWER_F", requested_by: "consumer-a" }
          - { command_index: 2, event_id: "T0-case4-canonical-evt1", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000322, kind: ProducerCompleted, artifact_id: "AID_LOWER_F", produced_by_action_id: "AID_LOWER_F" }
          - { command_index: 3, event_id: "T0-case4-canonical-evt2", sequence_number: 1, planning_generation: 0, emitted_at_unix_ns: 1700000000000000323, kind: ProducerCompleted, artifact_id: "AID_LOWER_F", produced_by_action_id: "AID_LOWER_F" }
    # 3つのorderingとも、evt1とevt2は同一event_id("T0-case4-canonical-evt1"/
    # "...evt2")を持つ -- evt2はevt1の重複到着(event_id基準の冪等性、
    # docs/design/issue-36-t0-incremental-contract.md §7.1)として無視される。
    expected_graph:
      final: [{ id: "AID_LOWER_F", state: completed }]
    expected_trace:
      assertion: "3つのordering全てで、最終graphのbyte-for-byte一致(JSON表現の完全一致)を確認する。"
    measurement: {}
    pass_criteria:
      t1: "3通りの到着順(正順・重複先行・遅延重複)すべてで最終公開結果が同一である。"

  # ------------------------------------------------------------ case 5 ----
  - id: T0-incremental-cancel-survives-shared-producer
    purpose: "一consumerの取消後も共有producerが生存する"
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_LOWER_ADD"]
        actions:
          - { id: "AID_LOWER_ADD", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_ADD"] }
      initial_nim_state:
        planning_generation: 0
        graph_states:
          AID_LOWER_ADD: { state: discovered, reference_count: 2 }
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case5-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000401
          kind: DemandCancelled
          artifact_id: "AID_LOWER_ADD"
          requested_by: "consumer-a"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions: []   # 参照カウント1は0に達していないため状態遷移なし
          diagnostic: null
    expected_state:
      reference_count_for_AID_LOWER_ADD: 1   # consumer-bのため生存
    expected_trace:
      assertion: "AID_LOWER_ADDがcancelledへ遷移しない(参照カウントが1のまま残る)。"
    measurement: {}
    pass_criteria:
      t1: "参照カウントが0に達しない限りproducerは生存する。"

  # ------------------------------------------------------- case 6 (診断1/5) ----
  - id: T0-incremental-diagnostic-stale-generation
    purpose: "古いgenerationのeventをNimが拒否する"
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_LOWER_ADD", "AID_VALIDATE_ADD"]
        actions:
          - { id: "AID_LOWER_ADD", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_ADD"] }
          - { id: "AID_VALIDATE_ADD", kind: ValidateIr, inputs: ["AID_LOWER_ADD"], outputs: ["AID_VALIDATE_ADD"] }
      initial_nim_state:
        planning_generation: 0
        graph_states:
          AID_LOWER_ADD: ready
          AID_VALIDATE_ADD: blocked_dependency
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case6-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000501
          kind: ProducerCompleted
          artifact_id: "AID_LOWER_ADD"
          produced_by_action_id: "AID_LOWER_ADD"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "AID_LOWER_ADD", from_state: ready, to_state: completed }
            - { action_id: "AID_VALIDATE_ADD", from_state: blocked_dependency, to_state: ready }
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case6-evt2"
          sequence_number: 2
          planning_generation: 0    # 送信側が"generation 0"時点で組み立てた、
                                     # 既に反映済みの情報を運ぶ遅延event
                                     # (AID_VALIDATE_ADDは既にreadyであり、
                                     # このeventはそれ以上の新情報を運ばない)
          emitted_at_unix_ns: 1700000000000000502
          kind: DependencyDiscovered
          discovering_action_id: "AID_DISCOVER_ADD"
          new_actions: []
          new_demands: []
          extends_inputs:
            - { action_id: "AID_VALIDATE_ADD", added_inputs: ["AID_LOWER_ADD"] }
        expected_response:
          kind: PlanDelta
          planning_generation: 0   # 変化なし
          changed_actions: []
          diagnostic: stale_generation
    expected_graph:
      after_evt2: [{ id: "AID_VALIDATE_ADD", state: ready }]   # 変化なし
    expected_trace:
      assertion: "evt2の処理結果としてstale_generationが記録され、状態遷移は発生しない。"
    measurement: {}
    pass_criteria:
      t1: >-
        planning_generationが現在より古く、かつ内容が反映済みのevent
        はstale_generationとしてNimに拒否され、graphを変化させない。

  # ------------------------------------------------------- case 7 (診断2/5) ----
  - id: T0-incremental-diagnostic-cancelled-result
    purpose: "取消後に完了した結果を診断する"
    start_session:
      initial_graph:
        demanded_artifacts: []   # 唯一のconsumerが既に要求を撤回済み、という開始状態
        actions:
          - { id: "AID_EVIDENCE_F", kind: EvaluateEvidence, inputs: ["AID_VALIDATE_F"], outputs: ["AID_EVIDENCE_F"] }
      initial_nim_state:
        planning_generation: 0
        graph_states:
          AID_EVIDENCE_F: { state: ready, reference_count: 0 }   # Rustはこのactionを既に実行開始している(ready->running)
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case7-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000601
          kind: ProducerCompleted
          artifact_id: "AID_EVIDENCE_F"
          produced_by_action_id: "AID_EVIDENCE_F"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "AID_EVIDENCE_F", from_state: ready, to_state: completed }
          diagnostic: cancelled_result
    expected_graph:
      after_evt1:
        - { id: "AID_EVIDENCE_F", state: completed, published: false }
          # ArtifactStoreへは記録するが、公開(demand解決)はしない(§6.3)
    expected_trace:
      assertion: "AID_EVIDENCE_Fの結果はArtifactStoreに保存されるが、どのconsumerへも公開されない。"
    measurement: {}
    pass_criteria:
      t1: >-
        runningへ遷移した後に参照カウントが0になったactionの結果は、
        完了時にcancelled_resultとして記録され、証拠は保持されつつ
        公開されない(黙って破棄しない、黙って公開しない)。

  # ------------------------------------------------------- case 8 (診断3/5) ----
  - id: T0-incremental-diagnostic-missing-producer
    purpose: "増分session内でのmissing producerを診断する"
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_VALIDATE_ADD"]
        actions:
          - { id: "AID_VALIDATE_ADD", kind: ValidateIr, inputs: ["AID_LOWER_ADD"], outputs: ["AID_VALIDATE_ADD"] }
      initial_nim_state:
        planning_generation: 1
        graph_states:
          AID_VALIDATE_ADD: blocked_dependency   # AID_LOWER_ADDを待っているが、
                                                   # このsessionにはまだ存在しない
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case8-evt1"
          sequence_number: 1
          planning_generation: 1
          emitted_at_unix_ns: 1700000000000000701
          kind: DependencyDiscovered
          discovering_action_id: "AID_DISCOVER_ADD"
          new_actions:
            - { id: "AID_TRIPLE_LOWER", kind: LowerSource, inputs: ["AID_MISSING_PRODUCER"], outputs: ["AID_TRIPLE_LOWER"] }
            # AID_TRIPLE_LOWER自身がAID_MISSING_PRODUCERという、graphの
            # どのactionのoutputsにも一致しないartifactを要求する
            # (意図的な欠落 -- 新規発見されたaction自身の依存が閉じて
            # いないケース)
          new_demands: []
          extends_inputs:
            - { action_id: "AID_VALIDATE_ADD", added_inputs: ["AID_TRIPLE_LOWER"] }
        expected_response:
          kind: Rejected
          reason_kind: missing_producer
          reason_detail: "AID_MISSING_PRODUCER has no declared producer in this graph"
    expected_graph:
      after_evt1: "graphは直前の有効なgeneration(1)の状態のまま変化しない"
    expected_trace:
      assertion: >-
        Nim plannerの既存需要閉包アルゴリズムがRejected/MissingProducerを
        返し、このevtはgraphへ一切反映されない(§5表、§1.2)。
    measurement: {}
    pass_criteria:
      t1: >-
        新規発見されたaction自身の依存にproducerが存在しない場合、既存
        RejectionReasonKind::MissingProducerが増分session内でも正しく
        報告され、graphは変化しない。

  # ------------------------------------------------------- case 9 (診断4/5) ----
  - id: T0-incremental-diagnostic-dependency-failed
    purpose: "blocking producerの失敗を診断する"
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_VALIDATE_ADD"]
        actions:
          - { id: "AID_LOWER_ADD", kind: LowerSource, inputs: [], outputs: ["AID_LOWER_ADD"] }
          - { id: "AID_VALIDATE_ADD", kind: ValidateIr, inputs: ["AID_LOWER_ADD"], outputs: ["AID_VALIDATE_ADD"] }
      initial_nim_state:
        planning_generation: 1
        graph_states:
          AID_LOWER_ADD: ready   # Rustが既に実行中(running overlay)
          AID_VALIDATE_ADD: blocked_dependency
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case9-evt1"
          sequence_number: 1
          planning_generation: 1
          emitted_at_unix_ns: 1700000000000000801
          kind: ProducerFailed
          artifact_id: "AID_LOWER_ADD"
          produced_by_action_id: "AID_LOWER_ADD"
          failure_reason: "SourceSnapshotMismatch"
        expected_response:
          kind: PlanDelta
          planning_generation: 1
          changed_actions:
            - { action_id: "AID_LOWER_ADD", from_state: ready, to_state: failed }
            - { action_id: "AID_VALIDATE_ADD", from_state: blocked_dependency, to_state: failed }
          diagnostic: dependency_failed
    expected_trace:
      assertion: >-
        AID_VALIDATE_ADDはproducer失敗を検知した時点で即座にfailedへ
        遷移し、readyを経由しない(既存compiler_work_executor.rs:679-696
        の「producer失敗時にはconsumerを開始しない」原則を増分文脈でも
        維持する)。cpu_slot_acquiredはAID_VALIDATE_ADDについて一度も
        記録されない。
    measurement: {}
    pass_criteria:
      t1: >-
        blocking producerがfailedで終わった場合、blocked_dependency中の
        consumerはdependency_failedとして即座にfailedへ遷移する。

  # ------------------------------------------------------ case 10 (診断5/5) ----
  - id: T0-incremental-diagnostic-cycle
    purpose: "新規発見された依存が既存graphとcycleを構成する場合を診断する"
    start_session:
      initial_graph:
        demanded_artifacts: ["action-a-out", "action-b-out"]
        actions:
          - { id: "action-a", kind: LowerSource, inputs: [], outputs: ["action-a-out"] }
          - { id: "action-b", kind: ValidateIr, inputs: ["action-a-out"], outputs: ["action-b-out"] }
      initial_nim_state:
        planning_generation: 1
        graph_states:
          action-a: ready
          action-b: blocked_dependency
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case10-evt1"
          sequence_number: 1
          planning_generation: 1
          emitted_at_unix_ns: 1700000000000000901
          kind: DependencyDiscovered
          discovering_action_id: "action-a"
          new_actions: []
          new_demands: []
          extends_inputs:
            - { action_id: "action-a", added_inputs: ["action-b-out"] }
        # action-aが(新たに)action-bの出力に依存すると判明 -> a->b->aのcycle
        expected_response:
          kind: Rejected
          reason_kind: cycle
          reason_detail: "adding action-b-out to action-a's inputs creates a cycle"
          cycle_path: ["action-a", "action-b", "action-a"]
    expected_graph:
      after_evt1: "graphは直前の有効なgeneration(1)の状態のまま変化しない"
    expected_trace:
      assertion: >-
        Nim plannerの既存cycle検出アルゴリズムがRejected/Cycleを
        cycle_path付きで返し、Rust runtimeはこの世代への更新を採用
        しない(直前の有効なgeneration状態を保持する)。
    measurement: {}
    pass_criteria:
      t1: >-
        新規発見依存が既存グラフとcycleを構成する場合、既存
        RejectionReasonKind::Cycle+cycle_pathが増分session内でも正しく
        報告され、グラフは更新前の状態に留まる。

  # ---------------------------------------------------- case 11 (否定case) ----
  - id: T0-incremental-no-fallback-on-rejection
    purpose: >-
      Rejected(missing_producer/cycle)を受けた後、Rust runtimeが外部
      compiler(rustc/nim)を一切起動せず、Rust側の代替planningロジックにも
      フォールバックせず、graphが直前の有効なgeneration状態のまま変化
      しないことを固定する(否定試験、docs/design/issue-36-t0-incremental-
      contract.md §11)。
    start_session:
      initial_graph:
        demanded_artifacts: ["AID_VALIDATE_ADD"]
        actions:
          - { id: "AID_VALIDATE_ADD", kind: ValidateIr, inputs: ["AID_LOWER_ADD"], outputs: ["AID_VALIDATE_ADD"] }
      initial_nim_state:
        planning_generation: 1
        graph_states:
          AID_VALIDATE_ADD: blocked_dependency
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case11-evt1"
          sequence_number: 1
          planning_generation: 1
          emitted_at_unix_ns: 1700000000000001001
          kind: DependencyDiscovered
          discovering_action_id: "AID_DISCOVER_ADD"
          new_actions:
            - { id: "AID_TRIPLE_LOWER", kind: LowerSource, inputs: ["AID_MISSING_PRODUCER"], outputs: ["AID_TRIPLE_LOWER"] }
          new_demands: []
          extends_inputs:
            - { action_id: "AID_VALIDATE_ADD", added_inputs: ["AID_TRIPLE_LOWER"] }
        expected_response:
          kind: Rejected
          reason_kind: missing_producer
          reason_detail: "AID_MISSING_PRODUCER has no declared producer in this graph"
    negative_assertions:
      - "このevent処理の間、Rust runtimeプロセスは rustc/nim のいずれの外部プロセスも起動しない(#5 T1のsource_never_spawns_a_subprocessと同じ回帰ガード手法をRust runtime側にも適用する)。"
      - "このevent処理の間、Rust runtime内にNim plannerを経由しない代替のplanning/scheduling経路(cycle検出やready frontier判定を独自に再実装したコードパス)は一切呼ばれない。"
      - "Rejectedの直後にNimへ送るgraphのdumpは、evt1送出直前のdumpとbyte-for-byte一致する(部分適用も別経路での更新もされていないことを証明する)。"
    measurement: {}
    pass_criteria:
      t1: >-
        Rejectedを受けた場合、Rust runtimeは外部compilerにもRust側の
        代替plannerにも一切フォールバックせず、graphを変化させない。
