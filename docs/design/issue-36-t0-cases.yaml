cases:
  # ------------------------------------------------------------ case 1 ----
  - id: T0-incremental-ready-branch-proceeds-during-discovery
    purpose: "別枝の依存発見中にready枝が実compiler workを開始する"
    start_session:
      initial_graph:
        demanded_artifacts: ["346daf22171a2722", "0e788157045cb74a"]
        actions: [*AID_LOWER_F, *AID_DISCOVER_ADD]   # catalogキー参照。単独有効
                                                     # (AID_LOWER_Fはready、
                                                     # AID_DISCOVER_ADDもready
                                                     # -- どちらもSource入力の
                                                     # みで未解決producerなし)
      initial_demands: []   # demanded_artifactsのみ、匿名要求者(参照カウント1)
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case1-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000001
          kind: ProducerCompleted
          artifact_id: "0e788157045cb74a"
          produced_by_action_id: "0e788157045cb74a"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "0e788157045cb74a", from_state: ready, to_state: completed }
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case1-evt2"
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000002
          kind: DependencyDiscovered
          discovering_action_id: "0e788157045cb74a"
          new_actions: [*AID_LOWER_ADD, *AID_VALIDATE_ADD, *AID_EVIDENCE_ADD]
          supersessions: []
          new_demands:
            - { artifact_id: "4539bb6e4724df6b", requested_by: "consumer-b" }
        expected_response:
          kind: PlanDelta
          planning_generation: 1
          changed_actions:
            - { action_id: "95d7231ab054085b", from_state: null, to_state: ready }
            - { action_id: "eac04bc4907983a3", from_state: null, to_state: blocked_dependency }
            - { action_id: "4539bb6e4724df6b", from_state: null, to_state: blocked_dependency }
          diagnostic: null
    expected_trace:
      assertion: >-
        AID_LOWER_F(fb9a5e4882ac44d3)についてcpu_slot_acquiredが記録された
        時刻は、AID_DISCOVER_ADDの完了(evt1)より前であり、かつ
        AID_LOWER_ADDがreadyになった時刻(evt2の応答時点)より前である --
        doubleの発見と無関係にf枝が先に実行を開始したことを直接のslot
        事象で示す。
      time_to_first_useful_work: "AID_LOWER_Fのcpu_slot_acquired時刻(session開始からの経過)"
      cpu_slot_invariant: >-
        任意の時刻において held_slots == running状態のaction数 と一致する。
        AID_VALIDATE_ADD/AID_EVIDENCE_ADDはblocked_dependency状態の間、
        一度もcpu_slot_acquiredを記録しない。
    measurement:
      dynamic_expansion_count_after_evt2: 1
      cpu_budget: 2
    pass_criteria:
      t1: >-
        AID_LOWER_F枝がAID_DISCOVER_ADDの発見処理と独立にready→running
        へ進む。blocked_dependency状態のactionはcpu_slot_acquiredを
        一度も記録しない。

  # ------------------------------------------------------------ case 2 ----
  - id: T0-incremental-duplicate-discovery-single-resume
    purpose: "既存Actionと同一idの再主張(duplicate discovery)が状態を変化させず、本物の完了で一度だけ再開する"
    start_session:
      initial_graph:
        demanded_artifacts: ["4539bb6e4724df6b"]
        actions: [*AID_LOWER_ADD, *AID_VALIDATE_ADD]   # 単独有効:
                                                        # AID_LOWER_ADDはready、
                                                        # AID_VALIDATE_ADDは
                                                        # blocked_dependency
                                                        # (AID_LOWER_ADDの
                                                        # 完了待ち、既に
                                                        # graph内に存在する
                                                        # producerを待つ、
                                                        # 不正な初期状態では
                                                        # ない)
      initial_demands: []
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case2-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000101
          kind: DependencyDiscovered
          discovering_action_id: "0e788157045cb74a"
          new_actions: [*AID_LOWER_ADD]   # 既にgraphに存在する同一idの
                                           # 再主張(duplicate discovery、
                                           # 例えば再試行によりRustが同じ
                                           # 発見をもう一度送った)
          supersessions: []
          new_demands: []
        expected_response:
          kind: PlanDelta
          planning_generation: 0   # 新しい情報を含まないため増分しない
          changed_actions: []       # 既存idの再主張は無害に無視される(§7.1)
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case2-evt2"
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000102
          kind: ProducerCompleted
          artifact_id: "95d7231ab054085b"
          produced_by_action_id: "95d7231ab054085b"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions:
            - { action_id: "95d7231ab054085b", from_state: ready, to_state: completed }
            - { action_id: "eac04bc4907983a3", from_state: blocked_dependency, to_state: ready }
          diagnostic: null
    expected_trace:
      assertion: >-
        AID_VALIDATE_ADD(eac04bc4907983a3)について blocked_dependency ->
        ready の遷移が正確に1回だけ記録される(evt1はgraphを変化させず、
        状態遷移を発生させない)。
      transition_count_blocked_to_ready: 1
    measurement:
      dynamic_expansion_count_after_evt1: 0
    pass_criteria:
      t1: >-
        既存Actionと同一idの発見の再主張は無害に無視され、blocking
        producer完了時に一度だけready化する。

  # ------------------------------------------------------------ case 3 ----
  - id: T0-incremental-semantic-key-merge
    purpose: "同一artifact_id(既存*_artifact_id関数の戻り値)への同時要求が一計算へ合流する"
    start_session:
      initial_graph:
        demanded_artifacts: []
        actions: [*AID_LOWER_F]
      initial_demands: []
    apply_deltas:
      - command_index: 1
        event:
          event_id: "T0-case3-evt1"
          sequence_number: 1
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000201
          kind: DemandRequested
          artifact_id: "fb9a5e4882ac44d3"
          requested_by: "consumer-a"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions: []   # 参照カウントの変化はgraph state遷移ではない
          diagnostic: null
      - command_index: 2
        event:
          event_id: "T0-case3-evt2"
          sequence_number: 2
          planning_generation: 0
          emitted_at_unix_ns: 1700000000000000202
          kind: DemandRequested
          artifact_id: "fb9a5e4882ac44d3"   # consumer-a/consumer-cは異なる
                                             # requested_byだが、artifact_id
                                             # は同一(同一source_snapshot_id・
                                             # 同一requested_functions・
                                             # 同一language -- §4.4)
          requested_by: "consumer-c"
        expected_response:
          kind: PlanDelta
          planning_generation: 0
          changed_actions: []
          diagnostic: null
    expected_state:
      reference_count_for_AID_LOWER_F: 2
    expected_trace:
      assertion: >-
        AID_LOWER_Fに対応するactionは1つのまま(2つ目のDemandRequestedは
