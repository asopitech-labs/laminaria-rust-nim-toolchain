[workspace]
resolver = "2"
members = [
    "crates/laminaria-fingerprint",
    "crates/laminaria-run",
    "crates/laminaria-plan",
    "crates/laminaria-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asopitech-labs/laminaria-rust-nim-toolchain"
