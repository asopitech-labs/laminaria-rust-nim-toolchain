[package]
name = "laminaria-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-derived owned IR for a declared Rust/Nim subset (issues #25/#3): real parsing, provenance, an effect-sequence model, and compared semantics-preserving transformations."

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
# Execution-only, per docs/design/issue-5-t0-target-generation-spec.md
# §6-4: verifies wasm_target.rs's own generated bytes actually run and
# produce the expected values. Never a dependency of the compilation
# path itself (wasm_target.rs never imports this crate) -- see that
# module's own `source_never_spawns_a_subprocess` regression test and
# the T0 doc's distinction between "compiling is owned" and "running
# the finished artifact via an existing engine is not delegation."
wasmtime = { version = "=18.0.4", default-features = false, features = ["cranelift", "runtime"] }
