[package]
name = "laminaria-experiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Issue #28 D1-a: case-registry validation for docs/design/issue-35-d0-cases.yaml, and owned-baseline measurement runners for M3-owned-independent-chains / M8-many-unrequested-nim-planner."

[[bin]]
name = "laminaria-case-registry"
path = "src/bin/case_registry.rs"

[[bin]]
name = "laminaria-m3-owned-baseline"
path = "src/bin/m3_owned_baseline.rs"

[[bin]]
name = "laminaria-m8-owned-baseline"
path = "src/bin/m8_owned_baseline.rs"

[dependencies]
laminaria-plan = { path = "../laminaria-plan" }
laminaria-run = { path = "../laminaria-run" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
