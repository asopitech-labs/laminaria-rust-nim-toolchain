[package]
name = "laminaria-experiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Direct executable experiments and measurement runners for issue #28."

[[bin]]
name = "laminaria-m3-owned-baseline"
path = "src/bin/m3_owned_baseline.rs"

[[bin]]
name = "laminaria-m8-owned-baseline"
path = "src/bin/m8_owned_baseline.rs"

[[bin]]
name = "laminaria-d1b1-reference-cases"
path = "src/bin/d1b1_reference_cases_runner.rs"

[[bin]]
name = "laminaria-d1b2-new-fixtures"
path = "src/bin/d1b2_new_fixtures_runner.rs"

[[bin]]
name = "laminaria-issue50-rust-cross-layer-baseline"
path = "src/bin/rust_cross_layer_baseline.rs"

[[bin]]
name = "laminaria-issue47-g3-e0-vs-e1"
path = "src/bin/g3_e0_vs_e1_runner.rs"

[dependencies]
laminaria-fingerprint = { path = "../laminaria-fingerprint" }
laminaria-ir = { path = "../laminaria-ir" }
laminaria-plan = { path = "../laminaria-plan" }
laminaria-run = { path = "../laminaria-run" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
