[package]
name = "laminaria-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LAMINARIA command-line entry point (doctor: environment and toolchain fingerprinting, issue #18)."

[[bin]]
name = "laminaria"
path = "src/main.rs"

[dependencies]
laminaria-fingerprint = { path = "../laminaria-fingerprint" }
laminaria-run = { path = "../laminaria-run" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
