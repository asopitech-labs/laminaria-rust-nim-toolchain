name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A separate, deliberately lean job rather than adding windows-latest to
  # the `rust` matrix below: that job's fixture steps are bash/jq-heavy and
  # Unix-specific throughout (rm -rf, awk, /tmp paths, Nim install), and
  # porting all of it to Windows is out of scope here. This job exists
  # specifically to give the Windows-only code paths *some* CI coverage
  # instead of none (there was none before): laminaria-run's tracer.rs had
  # a Level 1 (default probe level) code path that unconditionally failed
  # on non-Unix targets, entirely undetected by CI, since only Ubuntu/macOS
  # ever ran it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: laminaria run smoke test -- Level 1 (the CLI default) must not hard-fail here
        shell: bash
        run: |
          cargo run -q -p laminaria-cli -- run \
            --workload-id windows-smoke --scenario-id smoke --runs-root runs --json \
            -- cmd /c "echo hello" \
            > run.json
          SUCCESS=$(jq -r '.result.success' run.json)
          [ "$SUCCESS" = "true" ] || { echo "expected success=true, got $SUCCESS"; cat run.json; exit 1; }
          PROBE_LEVEL=$(jq -r '.process_trace.processes[0].probe_level' run.json)
          echo "probe_level recorded: $PROBE_LEVEL (Level 1 falls back to portable lifecycle-only tracing on this platform -- see tracer.rs's NON_UNIX_LEVEL1_FALLBACK_NOTE)"

      - name: laminaria regenerate-summary rejects a path-traversal run_id
        shell: bash
        run: |
          mkdir -p runs
          if cargo run -q -p laminaria-cli -- regenerate-summary --runs-root runs "../outside"; then
            echo "expected regenerate-summary to reject a path-traversal run_id"
            exit 1
          fi

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt/clippy
        run: rustup component add rustfmt clippy

      # Moved ahead of `cargo test`: `laminaria-plan`'s own tests
      # (issue #8) build and invoke a real `laminaria-planner` binary
      # via `nim c`, so Nim must already be on PATH before `cargo test`
      # runs, not only before the later Nim-fixture steps that used to
      # be the only consumer of this step.
      - name: Install Nim
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update && sudo apt-get install -y nim
          else
            brew install nim
          fi

      # issue #8/#6's self-build toolchain verification
      # (self_build.rs's resolve_verified_toolchain) requires
      # toolchains.lock.toml's nim2_pinned entry to actually resolve at
      # its declared bin_dir (~/.choosenim/toolchains/nim-2.2.10/bin) --
      # a real gap a second external review caught (this job's plain
      # apt/brew Nim above never populates that path, so the self-build
      # tests failed closed with ToolchainUnresolved). Fixed by making
      # this bootstrap actually match what the lock file pins, the same
      # choosenim mechanism scripts/bootstrap.sh already documents for
      # this -- not by loosening the lock's own pinning. Independent of
      # the plain "Install Nim" step above, which stays as-is for the
      # later fixture-building steps that only need *some* nim runtime
      # on PATH, not the pinned identity.
      - name: Install pinned Nim via choosenim (matches toolchains.lock.toml's nim2_pinned)
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          "$HOME/.nimble/bin/choosenim" --yes 2.2.10
          PINNED_NIM="$HOME/.choosenim/toolchains/nim-2.2.10/bin/nim"
          [ -x "$PINNED_NIM" ] || {
            echo "expected $PINNED_NIM to exist and be executable after choosenim --yes 2.2.10"
            exit 1
          }
          "$PINNED_NIM" --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: doctor (environment fingerprint, informational)
        run: cargo run -p laminaria-cli -- doctor
        continue-on-error: true

      # #11's first two committed "Core workloads" fixtures, built natively
      # on each runner as evidence for #18's acceptance criterion that these
      # tool subsets actually reproduce a build, not just resolve a version.
      - name: Build rust-heavy-workspace fixture
        run: |
          cd fixtures/rust-heavy-workspace
          cargo build --workspace
          cargo run -q -p fixture-bin

      - name: Build nim-heavy-workspace fixture
        run: |
          cd fixtures/nim-heavy-workspace
          nim c --nimcache:nimcache -o:fixture_out src/fixture.nim
          ./fixture_out

      # Issue #19 Experiments 1/2/4/5: wrap real Cargo and Nim builds with
      # `laminaria run` and check the recorded Run evidence is actually
      # meaningful, not merely present. Runs after the plain builds above
      # (whose target/nimcache dirs are now warm) so the traced runs below
      # are true no-ops, and a fresh cold build is forced explicitly where
      # the cold/no-op distinction itself is the thing being checked.
      #
      # `laminaria run` locates its `laminaria-rustc-wrapper` auxiliary
      # binary (crates/laminaria-run/src/cargo_wrapper.rs's
      # find_rustc_wrapper_binary) next to its own running executable in
      # `target/debug/`. The earlier `cargo test --workspace` step does
      # NOT put it there -- it only compiles a separately-hashed test
      # harness copy under `target/debug/deps/` -- so an explicit
      # `cargo build --workspace` is required first, or wrapper
      # substitution silently falls back to root-only tracing (a real gap
      # this exact step's assertions caught in CI once already: see the
      # laminaria-run NOTES.md history).
      - name: Build workspace binaries (laminaria-rustc-wrapper needs the plain target/debug/ copy)
        run: cargo build --workspace

      # Issues #8/#6/#4's shared first slice, this repo's documented
      # self-build/CI entry point (issue #6's own acceptance criterion):
      # stage0 is an ordinary, un-planned build by external tools (`nim
      # c` + `cargo build --release`, deliberately not `laminaria
      # self-build`); stage0's own `laminaria` binary then plans (via the
      # real Nim Planning Kernel) and executes the construction of
      # stage1. See docs/self-build.md for the full protocol and why
      # `nim c`, not `nimble build`, is used here (nimble was found to
      # exit 0 on a genuine compile failure).
      - name: Build stage0 (nim-planner + Rust host, an ordinary un-planned build)
        run: |
          cd nim-planner
          nim c --path:src -o:bin/laminaria-planner src/laminaria_planner.nim
          cd ..
          cargo build --workspace --release

      - name: Run laminaria self-build to produce stage1 (issues #8/#6/#4)
        run: |
          ./target/release/laminaria self-build \
            --planner nim-planner/bin/laminaria-planner \
            --generation-root target/laminaria-gen/stage1 \
            --generation-label stage0-to-stage1 \
            --runs-root runs \
            --json \
            > /tmp/self-build.json
          cat /tmp/self-build.json
          FAILED=$(jq '[.actions[] | select(.succeeded == false)] | length' /tmp/self-build.json)
          [ "$FAILED" = "0" ] || { echo "expected every self-build action to succeed"; exit 1; }
          for bin in laminaria laminaria-planner laminaria-rustc-wrapper laminaria-cc-wrapper; do
            [ -x "target/laminaria-gen/stage1/$bin" ] || { echo "expected stage1 to contain $bin"; exit 1; }
          done

      # The actual proof this isn't "linked but unused" (issue #8):
      # stage1's own freshly built laminaria binary, run with no flags at
      # all, must find its own sibling laminaria-planner and plan
      # successfully.
      - name: Confirm stage1's own planner actually plans (issues #8/#6/#4)
        run: |
          target/laminaria-gen/stage1/laminaria plan-self-build --json > /tmp/stage1-plan.json
          PRODUCED_BY=$(jq -r '.data.produced_by' /tmp/stage1-plan.json)
          [ "$PRODUCED_BY" = "laminaria-nim-planning-kernel" ] || {
            echo "expected stage1's own planner to produce a plan with produced_by=laminaria-nim-planning-kernel, got $PRODUCED_BY"
            exit 1
          }
          echo "stage1's own laminaria-planner independently plans successfully (plan_id=$(jq -r '.data.plan_id' /tmp/stage1-plan.json))"

      - name: Trace a cold and a true-no-op rust-heavy-workspace build (issue #19 Experiment 1)
        run: |
          rm -rf fixtures/rust-heavy-workspace/target
          cargo run -q -p laminaria-cli -- run \
            --workload-id rust-heavy-workspace --scenario-id cold-build --runs-root runs --json \
            --observe fixtures/rust-heavy-workspace/target \
            -- cargo build --manifest-path fixtures/rust-heavy-workspace/Cargo.toml --workspace \
            > /tmp/cold-run.json
          cargo run -q -p laminaria-cli -- run \
            --workload-id rust-heavy-workspace --scenario-id true-noop --runs-root runs --json \
            --observe fixtures/rust-heavy-workspace/target \
            -- cargo build --manifest-path fixtures/rust-heavy-workspace/Cargo.toml --workspace \
            > /tmp/noop-run.json
          COLD_SUCCESS=$(jq -r '.result.success' /tmp/cold-run.json)
          NOOP_SUCCESS=$(jq -r '.result.success' /tmp/noop-run.json)
          COLD_CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/cold-run.json)
          NOOP_CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/noop-run.json)
          echo "cold build user_cpu_seconds=$COLD_CPU, true-noop user_cpu_seconds=$NOOP_CPU"
          [ "$COLD_SUCCESS" = "true" ] || { echo "cold build Run should have succeeded"; exit 1; }
          [ "$NOOP_SUCCESS" = "true" ] || { echo "no-op build Run should have succeeded"; exit 1; }
          [ "$COLD_CPU" != "null" ] && [ "$NOOP_CPU" != "null" ] || {
            echo "resource usage must not be missing on a supported (Linux/macOS) runner"; exit 1;
          }
          awk -v cold="$COLD_CPU" -v noop="$NOOP_CPU" 'BEGIN { exit !(cold > noop) }' || {
            echo "expected the cold build's cumulative CPU (${COLD_CPU}s) to clearly exceed the true-no-op rebuild's (${NOOP_CPU}s) -- if it doesn't, the tracer isn't actually attributing rustc/linker descendant work to the traced root command"
            exit 1
          }
          # Per-rustc-invocation granularity via RUSTC-wrapper substitution
          # (crates/laminaria-run/src/cargo_wrapper.rs, modeled on
          # rustc-perf's real rustc-fake -- see NOTES.md). The 3-crate
          # workspace (fixture-core -> fixture-mid -> fixture-bin) should
          # produce one recorded rustc invocation per crate at minimum, each
          # with its own pid and non-null resource usage, on the cold build.
          PROCESS_COUNT=$(jq '.process_trace.processes | length' /tmp/cold-run.json)
          [ "$PROCESS_COUNT" -ge 4 ] || {
            echo "expected at least 4 process records (1 root + >=3 per-crate rustc invocations), got $PROCESS_COUNT"
            exit 1
          }
          DISTINCT_PIDS=$(jq '[.process_trace.processes[].pid] | unique | length' /tmp/cold-run.json)
          [ "$DISTINCT_PIDS" = "$PROCESS_COUNT" ] || {
            echo "expected every process record to have a distinct pid, got $DISTINCT_PIDS distinct out of $PROCESS_COUNT records"
            exit 1
          }
          RUSTC_CPU_NULLS=$(jq '[.process_trace.processes[1:][].resource_usage.user_cpu_seconds | select(. == null)] | length' /tmp/cold-run.json)
          [ "$RUSTC_CPU_NULLS" = "0" ] || {
            echo "expected every wrapper-recorded rustc invocation to have non-null resource usage, found $RUSTC_CPU_NULLS missing"
            exit 1
          }
          echo "per-rustc-invocation records: $PROCESS_COUNT total, $DISTINCT_PIDS distinct pids, 0 missing resource usage"
          # Level 2 compiler telemetry via Cargo's own --message-format=json
          # (crates/laminaria-run/src/cargo_telemetry.rs -- see NOTES.md).
          # The cold build should report 3 artifacts, none fresh; the
          # true-no-op rebuild should report the same 3 artifacts, all
          # fresh -- Cargo's own per-crate cache-freshness signal, checked
          # directly rather than only inferred from CPU time.
          COLD_ARTIFACTS=$(jq '.compiler_telemetry.artifacts | length' /tmp/cold-run.json)
          COLD_FRESH=$(jq '[.compiler_telemetry.artifacts[] | select(.fresh)] | length' /tmp/cold-run.json)
          NOOP_ARTIFACTS=$(jq '.compiler_telemetry.artifacts | length' /tmp/noop-run.json)
          NOOP_FRESH=$(jq '[.compiler_telemetry.artifacts[] | select(.fresh)] | length' /tmp/noop-run.json)
          [ "$COLD_ARTIFACTS" = "3" ] || { echo "expected 3 reported artifacts on the cold build, got $COLD_ARTIFACTS"; exit 1; }
          [ "$COLD_FRESH" = "0" ] || { echo "expected 0 fresh artifacts on the cold build, got $COLD_FRESH"; exit 1; }
          [ "$NOOP_ARTIFACTS" = "3" ] || { echo "expected 3 reported artifacts on the true-no-op rebuild, got $NOOP_ARTIFACTS"; exit 1; }
          [ "$NOOP_FRESH" = "3" ] || { echo "expected all 3 artifacts fresh on the true-no-op rebuild, got $NOOP_FRESH"; exit 1; }
          BUILD_FINISHED=$(jq -r '.compiler_telemetry.build_finished_success' /tmp/cold-run.json)
          [ "$BUILD_FINISHED" = "true" ] || { echo "expected compiler_telemetry.build_finished_success == true, got $BUILD_FINISHED"; exit 1; }
          echo "Level 2 compiler telemetry: cold 0/$COLD_ARTIFACTS fresh, true-noop $NOOP_FRESH/$NOOP_ARTIFACTS fresh"
          # No-op-safe artifact inventory (crates/laminaria-run/src/
          # artifact_inventory.rs -- issue #20's first slice, see NOTES.md).
          # A cold build's pre-snapshot of target/ is empty, so every
          # record must be Created; a true no-op rebuild's pre/post
          # snapshots should be identical for the vast majority of files --
          # allowing a small, bounded number of Cargo-internal exceptions
          # (its own .d dep-info files are rewritten with identical content
          # on every invocation, a real finding documented in NOTES.md, not
          # a bug in this check).
          COLD_ARTIFACT_TOTAL=$(jq '.artifact_delta.records | length' /tmp/cold-run.json)
          COLD_ARTIFACT_CREATED=$(jq '[.artifact_delta.records[] | select(.state=="Created")] | length' /tmp/cold-run.json)
          [ "$COLD_ARTIFACT_TOTAL" -gt 0 ] || { echo "expected a non-empty artifact inventory on the cold build"; exit 1; }
          [ "$COLD_ARTIFACT_TOTAL" = "$COLD_ARTIFACT_CREATED" ] || {
            echo "expected every artifact record to be Created on a cold build (empty pre-snapshot), got $COLD_ARTIFACT_CREATED/$COLD_ARTIFACT_TOTAL"
            exit 1
          }
          NOOP_ARTIFACT_UNCHANGED=$(jq '[.artifact_delta.records[] | select(.state=="Unchanged")] | length' /tmp/noop-run.json)
          NOOP_ARTIFACT_CANDIDATES=$(jq '.artifact_delta.changed_candidate_count' /tmp/noop-run.json)
          NOOP_ARTIFACT_HASH_SECONDS=$(jq '.artifact_delta.hash_seconds' /tmp/noop-run.json)
          [ "$NOOP_ARTIFACT_CANDIDATES" -le 5 ] || {
            echo "expected at most a handful of changed candidates on a true no-op rebuild, got $NOOP_ARTIFACT_CANDIDATES -- if this grows, either Cargo's own no-op behavior changed or artifact_inventory's diff logic regressed"
            exit 1
          }
          awk -v cold="$COLD_ARTIFACT_CREATED" -v unchanged="$NOOP_ARTIFACT_UNCHANGED" 'BEGIN { exit !(unchanged >= cold - 5) }' || {
            echo "expected the true no-op rebuild's Unchanged count ($NOOP_ARTIFACT_UNCHANGED) to be close to the cold build's total artifact count ($COLD_ARTIFACT_CREATED)"
            exit 1
          }
          echo "artifact inventory: cold $COLD_ARTIFACT_CREATED/$COLD_ARTIFACT_TOTAL created, true-noop $NOOP_ARTIFACT_UNCHANGED unchanged / $NOOP_ARTIFACT_CANDIDATES changed candidate(s) hashed in ${NOOP_ARTIFACT_HASH_SECONDS}s"

      # Scenario repetition and noise-floor-aware comparison (issue #21's
      # first slice, crates/laminaria-run/src/scenario.rs -- see NOTES.md).
      # Separate concern from the step above: that one traces a single
      # cold/no-op pair; this one exercises repeated sampling, statistics,
      # report regeneration from disk, and the comparator's confounding-
      # factor detection (process count / artifact profile), not just raw
      # Run capture.
      - name: Scenario repetition, regeneration, and noise-floor comparison (issue #21)
        run: |
          rm -rf fixtures/rust-heavy-workspace/target
          cargo run -q -p laminaria-cli -- scenario-run \
            --workload rust-heavy-workspace --kind cold --repeat 2 --runs-root runs --json \
            > /tmp/scenario-cold.json
          cargo run -q -p laminaria-cli -- scenario-run \
            --workload rust-heavy-workspace --kind noop --repeat 3 --runs-root runs --json \
            > /tmp/scenario-noop.json

          COLD_SAMPLE_COUNT=$(jq '.wall_seconds.sample_count' /tmp/scenario-cold.json)
          [ "$COLD_SAMPLE_COUNT" = "2" ] || { echo "expected 2 retained cold samples, got $COLD_SAMPLE_COUNT"; exit 1; }
          NOOP_SAMPLE_COUNT=$(jq '.wall_seconds.sample_count' /tmp/scenario-noop.json)
          [ "$NOOP_SAMPLE_COUNT" = "3" ] || { echo "expected 3 retained no-op samples, got $NOOP_SAMPLE_COUNT"; exit 1; }

          # Preparation/cache-state must actually be recorded now (issue
          # #19's known_gaps note about these always being default is
          # closed for scenario-run specifically -- see scenario.rs).
          FIRST_COLD_RUN_ID=$(jq -r '.run_ids[0]' /tmp/scenario-cold.json)
          COLD_CACHE_STATE=$(jq -r '.cache_state.notes[0]' "runs/$FIRST_COLD_RUN_ID/run.json")
          [ "$COLD_CACHE_STATE" = "Cold" ] || { echo "expected cache_state.notes[0]=Cold, got $COLD_CACHE_STATE"; exit 1; }
          COLD_PREP_STEPS=$(jq '.preparation_record.steps | length' "runs/$FIRST_COLD_RUN_ID/run.json")
          [ "$COLD_PREP_STEPS" -ge 1 ] || { echo "expected at least one recorded preparation step"; exit 1; }

          # Regeneration from disk must reproduce the same report exactly.
          RUN_ID_ARGS=$(jq -r '.run_ids[] | "--run-id " + .' /tmp/scenario-cold.json | tr '\n' ' ')
          eval cargo run -q -p laminaria-cli -- scenario-regenerate \
            --runs-root runs --scenario-id cold-build $RUN_ID_ARGS \
            > /tmp/scenario-cold-regenerated.json
          diff <(jq -S . /tmp/scenario-cold.json) <(jq -S . /tmp/scenario-cold-regenerated.json) \
            && echo "regenerated report matches the original exactly" \
            || { echo "regenerated report does not match the original"; exit 1; }

          # The comparator: cold vs. no-op must be flagged above_noise with
          # both confounding factors present (this is the literal
          # acceptance criterion "a deliberately noisy or path-divergent
          # run is prevented from being labeled a valid regression/
          # improvement result" -- cold vs. no-op is exactly such a pair).
          set +e
          cargo run -q -p laminaria-cli -- scenario-compare \
            --baseline /tmp/scenario-noop.json --candidate /tmp/scenario-cold.json \
            > /tmp/scenario-compare.json
          COMPARE_EXIT=$?
          set -e
          [ "$COMPARE_EXIT" = "1" ] || {
            echo "expected scenario-compare to exit 1 (confounding factors present) comparing no-op vs cold, got $COMPARE_EXIT"
            exit 1
          }
          VERDICT=$(jq -r '.wall_time_verdict' /tmp/scenario-compare.json)
          [ "$VERDICT" = "above_noise" ] || { echo "expected above_noise, got $VERDICT"; exit 1; }
          PROCESS_COUNT_CHANGED=$(jq -r '.process_count_changed' /tmp/scenario-compare.json)
          [ "$PROCESS_COUNT_CHANGED" = "true" ] || { echo "expected process_count_changed=true"; exit 1; }
          echo "scenario comparison: $(jq -c '.confounding_notes' /tmp/scenario-compare.json)"

      - name: Trace a cold nim-heavy-workspace build (issue #19 Experiment 2)
        run: |
          rm -rf fixtures/nim-heavy-workspace/nimcache fixtures/nim-heavy-workspace/fixture_out
          cargo run -q -p laminaria-cli -- run \
            --workload-id nim-heavy-workspace --scenario-id cold-build --runs-root runs --json \
            -- nim c --nimcache:fixtures/nim-heavy-workspace/nimcache \
               -o:fixtures/nim-heavy-workspace/fixture_out fixtures/nim-heavy-workspace/src/fixture.nim \
            > /tmp/nim-run.json
          fixtures/nim-heavy-workspace/fixture_out
          SUCCESS=$(jq -r '.result.success' /tmp/nim-run.json)
          CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/nim-run.json)
          [ "$SUCCESS" = "true" ] || { echo "nim build Run should have succeeded"; exit 1; }
          [ "$CPU" != "null" ] || { echo "resource usage must not be missing on a supported (Linux/macOS) runner"; exit 1; }
          echo "nim build user_cpu_seconds=$CPU"
          # Per-C-compiler-invocation granularity via CC-wrapper
          # substitution (crates/laminaria-run/src/nim_wrapper.rs, modeled
          # on Nim's own --<ccname>.exe/--<ccname>.linkerexe config vars --
          # see NOTES.md). nim-heavy-workspace (primes -> geometry ->
          # fixture, plus stdlib modules) should produce multiple recorded
          # compiler invocations (one per generated .c file) plus one
          # separately-recorded link invocation, each with a distinct pid
          # and non-null resource usage.
          NIM_PROCESS_COUNT=$(jq '.process_trace.processes | length' /tmp/nim-run.json)
          [ "$NIM_PROCESS_COUNT" -ge 5 ] || {
            echo "expected at least 5 process records (1 root + several per-.c-file compiles + 1 link), got $NIM_PROCESS_COUNT"
            exit 1
          }
          NIM_DISTINCT_PIDS=$(jq '[.process_trace.processes[].pid] | unique | length' /tmp/nim-run.json)
          [ "$NIM_DISTINCT_PIDS" = "$NIM_PROCESS_COUNT" ] || {
            echo "expected every process record to have a distinct pid, got $NIM_DISTINCT_PIDS distinct out of $NIM_PROCESS_COUNT records"
            exit 1
          }
          CC_CPU_NULLS=$(jq '[.process_trace.processes[1:][].resource_usage.user_cpu_seconds | select(. == null)] | length' /tmp/nim-run.json)
          [ "$CC_CPU_NULLS" = "0" ] || {
            echo "expected every wrapper-recorded compiler invocation to have non-null resource usage, found $CC_CPU_NULLS missing"
            exit 1
          }
          echo "per-C-compiler-invocation records: $NIM_PROCESS_COUNT total, $NIM_DISTINCT_PIDS distinct pids, 0 missing resource usage"
          # Level 2 compiler telemetry via Nim's own hint stream
          # (crates/laminaria-run/src/nim_telemetry.rs, parsed from
          # stderr -- see NOTES.md). nim-heavy-workspace's own modules
          # (primes, geometry, fixture) plus stdlib modules should show up
          # as processed_modules, and the build should report linked=true.
          NIM_MODULE_COUNT=$(jq '.compiler_telemetry.processed_modules | length' /tmp/nim-run.json)
          [ "$NIM_MODULE_COUNT" -ge 3 ] || {
            echo "expected at least 3 processed modules (primes, geometry, fixture), got $NIM_MODULE_COUNT"
            exit 1
          }
          NIM_LINKED=$(jq -r '.compiler_telemetry.linked' /tmp/nim-run.json)
          [ "$NIM_LINKED" = "true" ] || { echo "expected compiler_telemetry.linked == true, got $NIM_LINKED"; exit 1; }
          NIM_LINES=$(jq -r '.compiler_telemetry.lines_compiled' /tmp/nim-run.json)
          [ "$NIM_LINES" != "null" ] || { echo "expected compiler_telemetry.lines_compiled to be populated"; exit 1; }
          NIM_PEAK_MEM=$(jq -r '.compiler_telemetry.peak_mem_bytes' /tmp/nim-run.json)
          [ "$NIM_PEAK_MEM" != "null" ] || { echo "expected compiler_telemetry.peak_mem_bytes to be populated"; exit 1; }
          echo "Level 2 Nim telemetry: $NIM_MODULE_COUNT modules, linked=$NIM_LINKED, $NIM_LINES lines, $NIM_PEAK_MEM peak_mem_bytes"

      # Issue #19 Experiment 5: a failed child process must not discard
      # partial evidence. Checked here rather than only in laminaria-run's
      # own unit tests, so the CLI's exit-code propagation is covered too.
      - name: Trace a failing command and confirm evidence is preserved (issue #19 Experiment 5)
        run: |
          set +e
          cargo run -q -p laminaria-cli -- run \
            --workload-id ci-smoke --scenario-id deliberate-failure --runs-root runs --json \
            -- sh -c 'echo deliberate failure 1>&2; exit 5' \
            > /tmp/failure-run.json
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 1 ]; then
            echo "expected laminaria run to exit 1 (traced command failed), got $STATUS"
            exit 1
          fi
          SUCCESS=$(jq -r '.result.success' /tmp/failure-run.json)
          CODE=$(jq -r '.result.root_exit_status.code' /tmp/failure-run.json)
          CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/failure-run.json)
          [ "$SUCCESS" = "false" ] || { echo "expected result.success=false"; exit 1; }
          [ "$CODE" = "5" ] || { echo "expected root_exit_status.code=5, got $CODE"; exit 1; }
          [ "$CPU" != "null" ] || { echo "resource usage must be captured even for a failed command"; exit 1; }
          echo "failure evidence preserved: exit code and resource usage both present"

      # Issue #19: "raw evidence can regenerate summary.json without
      # rerunning the workload" -- exercised end-to-end via the CLI
      # against a real written Run, not just laminaria-run's own tests.
      - name: Regenerate summary.json from an already-written Run (issue #19)
        run: |
          RUN_ID=$(jq -r '.run_id' /tmp/nim-run.json)
          rm "runs/$RUN_ID/summary.json"
          cargo run -q -p laminaria-cli -- regenerate-summary --runs-root runs "$RUN_ID" > /tmp/regenerated-summary.json
          diff <(jq -S . "runs/$RUN_ID/summary.json") <(jq -S . /tmp/regenerated-summary.json)
          echo "regenerated summary.json matches the file laminaria-cli wrote on disk"

      # Issue #19 Experiment 6: minimal (Level 0) vs resource-traced
      # (Level 1) modes must be comparable for observer overhead
      # (docs/measurement-foundation.md section 12). Checked here on a CI
      # runner too, not just this project's own dev machine -- confirms
      # --probe-level level0 actually skips resource accounting (every
      # resource_usage field null) and Cargo/Nim wrapper substitution
      # (process_trace has exactly one record, the root), and reports the
      # measured overhead delta for this run's environment.
      - name: Compare Level 0 vs Level 1 tracer overhead (issue #19 Experiment 6)
        run: |
          cargo run -q -p laminaria-cli -- run \
            --workload-id overhead-check --scenario-id level0 --runs-root runs --probe-level level0 --json \
            -- cargo build --manifest-path fixtures/rust-heavy-workspace/Cargo.toml --workspace \
            > /tmp/level0-run.json
          cargo run -q -p laminaria-cli -- run \
            --workload-id overhead-check --scenario-id level1 --runs-root runs --probe-level level1 --json \
            -- cargo build --manifest-path fixtures/rust-heavy-workspace/Cargo.toml --workspace \
            > /tmp/level1-run.json
          LEVEL0_PROCESS_COUNT=$(jq '.process_trace.processes | length' /tmp/level0-run.json)
          [ "$LEVEL0_PROCESS_COUNT" = "1" ] || {
            echo "expected Level 0 to skip wrapper substitution entirely (1 process record), got $LEVEL0_PROCESS_COUNT"
            exit 1
          }
          LEVEL0_CPU_NULL=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/level0-run.json)
          [ "$LEVEL0_CPU_NULL" = "null" ] || {
            echo "expected Level 0 resource_usage.user_cpu_seconds to be null (deliberately not measured), got $LEVEL0_CPU_NULL"
            exit 1
          }
          LEVEL0_OVERHEAD=$(jq -r '.measurement_overhead.probe_level' /tmp/level0-run.json)
          [ "$LEVEL0_OVERHEAD" = "level0_lifecycle" ] || {
            echo "expected measurement_overhead.probe_level == level0_lifecycle, got $LEVEL0_OVERHEAD"
            exit 1
          }
          LEVEL0_SECONDS=$(jq -r '.measurement_overhead.tracer_overhead_seconds' /tmp/level0-run.json)
          LEVEL1_SECONDS=$(jq -r '.measurement_overhead.tracer_overhead_seconds' /tmp/level1-run.json)
          echo "tracer_overhead_seconds: level0=$LEVEL0_SECONDS level1=$LEVEL1_SECONDS"

      - name: Build rust-nim-c-abi-baseline fixture
        run: |
          cd fixtures/rust-nim-c-abi-baseline/rust-bin
          cargo run

      - name: Build wide-parallel-graph fixture
        run: |
          cd fixtures/wide-parallel-graph
          cargo build --workspace
          cargo test --workspace
          cargo run -q -p aggregator

      - name: Build deep-critical-path-graph fixture
        run: |
          cd fixtures/deep-critical-path-graph
          cargo build --workspace
          cargo test --workspace
          cargo run -q -p fixture-bin

      - name: Build mixed-rust-nim-executable fixture
        run: |
          cd fixtures/mixed-rust-nim-executable/rust-bin
          cargo run

      - name: Build boundary-heavy-workload fixture
        run: |
          cd fixtures/boundary-heavy-workload/rust-bin
          cargo run

      - name: Build unchanged-noop-workspace fixture
        run: |
          cd fixtures/unchanged-noop-workspace
          cargo test
          cargo run
          cargo build

      - name: Build incremental-semantic-edit fixture
        run: |
          cd fixtures/incremental-semantic-edit
          cargo build --workspace
          cargo test --workspace
          cargo run -q -p aggregator
          scripts/apply-edit.sh
          cargo run -q -p aggregator
          scripts/revert-edit.sh
          cargo run -q -p aggregator
          git diff --exit-code crates/leaf-b/src/lib.rs

      - name: Build direct-native-link fixture
        run: |
          cd fixtures/direct-native-link
          cargo test --manifest-path rust-lib/Cargo.toml
          ./build.sh

      # Issue #4 Layer 5's required comparison: "conventional C ABI
      # baseline" (a cbindgen-generated header as the single source of
      # truth for the boundary) against the direct route just built
      # above, against the *same* unmodified rust-lib static library.
      # Run right after the direct route so both binaries being compared
      # for size exist from the same CI run. See
      # fixtures/direct-native-link/NOTES.md's "c-abi-baseline/" section
      # for what evidence this produces and its limits (whole-binary
      # size is confounded by unequal workload coverage between the two
      # main.nim files; call-overhead is not -- see the disassembly
      # comparison there).
      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build and run the direct-native-link c-abi-baseline comparison
        run: |
          cd fixtures/direct-native-link/c-abi-baseline
          ./build.sh

      # Issue #4 Layer 4, previously entirely untested: what happens
      # when a Rust function panics while called from Nim? Expected,
      # deterministic outcome verified below: SIGABRT (134) -- a plain
      # `extern "C" fn` is a "cannot unwind" boundary, confirmed by
      # rust-lib's own unit tests too. See panic-experiment/main.nim
      # and fixtures/direct-native-link/NOTES.md.
      - name: Build and run the direct-native-link panic-boundary experiment
        run: |
          cd fixtures/direct-native-link/panic-experiment
          cargo build --release --manifest-path ../rust-lib/Cargo.toml
          nim c --nimcache:nimcache --passL:"-L../rust-lib/target/release -lrustlib" -o:main main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 134 ]; then
            echo "main aborted via SIGABRT (134) -- the expected, deterministic panic-across-extern-C-boundary behavior"
          else
            echo "main exited with unexpected status $STATUS -- expected SIGABRT (134), investigate"
            exit 1
          fi

      # Issue #4 Layer 4, also previously untested: does calling into
      # Rust's extern "C" functions work from an OS thread *Nim*
      # created (not one Rust's own std::thread::spawn set up)? See
      # thread-experiment/main.nim and NOTES.md.
      - name: Build and run the direct-native-link thread-boundary experiment
        run: |
          cd fixtures/direct-native-link/thread-experiment
          cargo build --release --manifest-path ../rust-lib/Cargo.toml
          nim c --threads:on --nimcache:nimcache --passL:"-L../rust-lib/target/release -lrustlib" -o:main main.nim
          ./main

      # Issue #4 Layer 3/4, reverse direction: Rust calling a
      # Nim-provided function pointer (the "closures/function values"
      # matrix class, with no captured environment), and what happens
      # when a Nim exception is raised inside that callback while a
      # Rust stack frame is live. Expected, deterministic outcome
      # verified below: exit code 1 with a clean, correctly-attributed
      # "unhandled exception" report -- not a crash, not silent
      # corruption. See callback-experiment/main.nim and NOTES.md.
      - name: Build and run the direct-native-link callback-boundary experiment
        run: |
          cd fixtures/direct-native-link/callback-experiment
          cargo build --release --manifest-path ../rust-lib/Cargo.toml
          nim c --nimcache:nimcache --passL:"-L../rust-lib/target/release -lrustlib" -o:main main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 1 ]; then
            echo "main exited with status 1 -- the expected, clean unhandled-exception report"
          else
            echo "main exited with unexpected status $STATUS -- expected 1, investigate"
            exit 1
          fi

  # Issue #4's genuinely-open question, not #11's: every fixture above
  # uses `nim c`, which always produces native code via a generated-C
  # intermediate -- even with no header file, that route's ABI/symbol
  # shape is fundamentally C's. nlvm (https://github.com/arnetheduck/nlvm)
  # is Nim's existing LLVM-direct backend: no C source, no C compiler,
  # anywhere in the path. Isolated in its own job (not the `rust` matrix
  # above) because it's exploratory -- a failure here must not fail-fast
  # cancel the main fixture suite. Only Linux/Windows release binaries
  # exist upstream; no macOS build was attempted (nlvm's own build
  # pins/builds its own exact LLVM revision rather than reusing the
  # host's, and bootstraps its own Nim from C sources -- a large, risky
  # time investment for this session, versus this job's already-working
  # Linux binary).
  nlvm-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download nlvm (Linux continuous build)
        run: |
          curl -fLo nlvm.tar.xz https://github.com/arnetheduck/nlvm/releases/download/continuous/nlvm-linux-a9c3397.tar.xz
          tar xf nlvm.tar.xz
          find . -maxdepth 4 -iname 'nlvm*' -type f -exec chmod +x {} \;
          find . -maxdepth 4 -iname 'nlvm*' -type f

      - name: nlvm --version
        run: |
          NLVM_BIN=$(find "$PWD" -maxdepth 4 -iname 'nlvm' -type f -perm -u+x | head -1)
          echo "NLVM_BIN=$NLVM_BIN" >> "$GITHUB_ENV"
          "$NLVM_BIN" --version

      - name: Compile and run a trivial Nim program via nlvm (no C anywhere)
        run: |
          rm -rf ~/.cache/nim/hello_d # start from a clean per-project cache
          cd fixtures/direct-native-link/nlvm-experiment
          "$NLVM_BIN" c hello.nim
          ./hello
          echo "--- confirming nlvm's own build cache for THIS project contains no .c file ---"
          # Scope this to nlvm's actual per-project build cache
          # (~/.cache/nim/hello_d/, confirmed from the linker invocation
          # above), not nlvm's whole install tree -- that tree ships
          # unrelated bundled .c files of its own (Windows mingw COM
          # interop stubs, Nim stdlib's linenoise.c) that have nothing
          # to do with compiling hello.nim and would be a false positive.
          if [ -n "$(find ~/.cache/nim/hello_d -iname '*.c' 2>/dev/null)" ]; then
            echo "found .c file(s) in nlvm's build cache for hello.nim -- contradicts the C-free claim"
            find ~/.cache/nim/hello_d -iname '*.c'
            exit 1
          fi
          echo "no .c files found in nlvm's build cache for hello.nim (expected)"
          echo "cache contents for reference:"
          find ~/.cache/nim/hello_d -type f

      # The actual apples-to-apples comparison the smoke test above set
      # up for: the same rust-lib static library nim-bin/main.nim links
      # against (rust_transform, Point layout probe, by-value round
      # trip, pointer mutation), this time linked from Nim compiled via
      # nlvm instead of `nim c` -- same Rust artifact, different Nim
      # route, so any difference in outcome is attributable to the
      # Nim-side route alone.
      - name: Build rust-lib for the nlvm <-> Rust experiment
        run: cargo build --release --manifest-path fixtures/direct-native-link/rust-lib/Cargo.toml

      - name: Compile and run the nlvm <-> Rust direct-link experiment
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/nlvm-experiment
          "$NLVM_BIN" c --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          # ./main's last block is a *diagnosed, documented* nlvm ABI
          # bug (see NOTES.md): a by-value struct argument followed by
          # more parameters segfaults (exit 139) under nlvm's current
          # small-struct handling. Every block before it already
          # completed and printed its result by the time this happens.
          # Treat that specific, already-understood crash as an
          # expected outcome here, not a CI failure -- while still
          # failing on any *other*, unexplained exit code, which would
          # be a real regression worth investigating.
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 139 ]; then
            echo "main exited via SIGSEGV (139) -- the known, diagnosed nlvm struct-argument ABI bug (see NOTES.md), not a new failure"
          elif [ "$STATUS" -ne 0 ]; then
            echo "main exited with unexpected status $STATUS -- not the known SIGSEGV, investigate"
            exit 1
          fi
          echo "--- confirming no .c file in nlvm's build cache for THIS project ---"
          if [ -n "$(find ~/.cache/nim/main_d -iname '*.c' 2>/dev/null)" ]; then
            echo "found .c file(s) -- contradicts the C-free claim"
            find ~/.cache/nim/main_d -iname '*.c'
            exit 1
          fi
          echo "no .c files found (expected)"
          find ~/.cache/nim/main_d -type f
          echo "--- symbol resolution trail, same methodology as NOTES.md's nim-bin evidence ---"
          nm main | grep -E 'rust_transform|rust_point' || true

      # Cross-route confirmation of the panic-boundary finding above --
      # this is a Rust-side unwind-ABI behavior, not expected to be
      # route-dependent, but checked directly rather than assumed given
      # how many other things turned out to differ on nlvm today.
      - name: Build and run the panic-boundary experiment via nlvm
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/panic-experiment
          "$NLVM_BIN" c --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 134 ]; then
            echo "main aborted via SIGABRT (134) on the nlvm route too -- matches the nim c route"
          else
            echo "main exited with unexpected status $STATUS on the nlvm route -- expected SIGABRT (134), investigate"
            exit 1
          fi

      # Cross-route confirmation of the thread-boundary experiment too.
      - name: Build and run the thread-boundary experiment via nlvm
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/thread-experiment
          "$NLVM_BIN" c --threads:on --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          ./main

      # Cross-route confirmation of the callback-boundary experiment.
      # Route-DIVERGENT, verified directly rather than assumed to match
      # nim c: nlvm implements Nim's exceptions with real LLVM-level
      # stack unwinding (a `personality` function on generated
      # functions -- visible in rust-nim-llvm-lto-compatibility's own
      # merged IR), unlike nim c's default --exceptions:goto, which
      # never unwinds at all. A Nim exception crossing back through the
      # Rust extern "C" stack frame therefore hits nlvm's real unwinder,
      # which hits the same "cannot unwind past extern C" protection
      # that made rust_panics abort earlier -- so nlvm reports SIGABRT
      # (134) here where nim c cleanly exits 1. See NOTES.md.
      - name: Build and run the callback-boundary experiment via nlvm
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/callback-experiment
          "$NLVM_BIN" c --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 134 ]; then
            echo "main aborted via SIGABRT (134) on the nlvm route -- diverges from nim c's clean exit(1), a real route-dependent finding, not a bug (see NOTES.md)"
          else
            echo "main exited with unexpected status $STATUS on the nlvm route -- expected SIGABRT (134), investigate"
            exit 1
          fi

      # #11's own fixture (not #4's investigation, though it reuses this
      # job's nlvm download): does Rust's own LLVM IR and Nim's own LLVM
      # IR (via nlvm) merge into one module with llvm-link, before
      # either side reaches native codegen? See
      # fixtures/rust-nim-llvm-lto-compatibility/NOTES.md. Needs
      # llvm-link/opt/llvm-dis matching nlvm's pinned LLVM version
      # (checked directly to be 22.1.8, matching this project's own
      # pinned rustc's bundled LLVM exactly) -- installed here via
      # apt.llvm.org's own installer script, the standard route.
      - name: Install LLVM 22 tools (llvm-link/opt/llvm-dis) matching nlvm's pinned version
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          echo "LLVM_LINK_BIN=$(command -v llvm-link-22)" >> "$GITHUB_ENV"
          echo "OPT_BIN=$(command -v opt-22)" >> "$GITHUB_ENV"
          echo "LLVM_DIS_BIN=$(command -v llvm-dis-22)" >> "$GITHUB_ENV"
          echo "LLC_BIN=$(command -v llc-22)" >> "$GITHUB_ENV"

      - name: Build rust-nim-llvm-lto-compatibility fixture
        run: |
          cd fixtures/rust-nim-llvm-lto-compatibility
          ./build.sh

      # Issue #25's first experiment (docs/llvm-rediscovery-research.md):
      # trace a minimal semantic contract (see fixtures/
      # llvm-rediscovery-semantic-workload/CONTRACT.md) through Rust's and
      # Nim's own compiler stages independently, starting from source --
      # not from the already-merged .ll files #17's fixture (above)
      # produces. Separate fixture, separate concern: #17 asks "can these
      # two languages' LLVM IR be merged," #25 asks "what does each
      # compiler's own stage-by-stage lowering reveal about semantic
      # facts/policies neither language's source explicitly requested."
      - name: Trace the add() semantic workload through Rust and Nim independently (issue #25)
        run: |
          cd fixtures/llvm-rediscovery-semantic-workload
          ./trace.sh

      # Issue #25's candidate-substrate prototype (docs/
      # llvm-rediscovery-research.md's "prototype a candidate LAMINARIA
      # semantic/optimization substrate" + "demonstrate a backend-route
      # projection" acceptance criteria) -- a small representation, a
      # reference evaluator, an LLVM-IR backend projection, and one
      # transformation demonstrated both allowed (a real fact permits it)
      # and rejected (a hypothetical fact blocks it). Separate concern
      # from the two steps above: those trace what Rust/Nim's real
      # compilers do; this builds LAMINARIA's own candidate representation
      # and checks it against them. Needs plain `nim` (not nlvm -- this
      # fixture only needs Nim's real compiled *output* to cross-check
      # against, not its LLVM IR), not otherwise installed in this job.
      - name: Install Nim (for laminaria-semantic-substrate-prototype's cross-check)
        run: sudo apt-get install -y nim

      - name: Build and verify the candidate semantic substrate prototype (issue #25)
        run: |
          cd fixtures/laminaria-semantic-substrate-prototype
          NIM_BIN=$(command -v nim) ./trace.sh

  # Exercises the "container" EnvironmentFingerprint class from a clean,
  # native (non-Rosetta) environment — see docker/bootstrap.Dockerfile for
  # why this is a bootstrap/correctness check, not a performance baseline.
  docker-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap image
        run: docker build -f docker/bootstrap.Dockerfile -t laminaria-bootstrap .

      - name: doctor inside the container
        run: docker run --rm laminaria-bootstrap doctor
