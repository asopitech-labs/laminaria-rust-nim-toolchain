name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt/clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: doctor (environment fingerprint, informational)
        run: cargo run -p laminaria-cli -- doctor
        continue-on-error: true

      - name: Install Nim
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update && sudo apt-get install -y nim
          else
            brew install nim
          fi

      # #11's first two committed "Core workloads" fixtures, built natively
      # on each runner as evidence for #18's acceptance criterion that these
      # tool subsets actually reproduce a build, not just resolve a version.
      - name: Build rust-heavy-workspace fixture
        run: |
          cd fixtures/rust-heavy-workspace
          cargo build --workspace
          cargo run -q -p fixture-bin

      - name: Build nim-heavy-workspace fixture
        run: |
          cd fixtures/nim-heavy-workspace
          nim c --nimcache:nimcache -o:fixture_out src/fixture.nim
          ./fixture_out

      # Issue #19 Experiments 1/2/4/5: wrap real Cargo and Nim builds with
      # `laminaria run` and check the recorded Run evidence is actually
      # meaningful, not merely present. Runs after the plain builds above
      # (whose target/nimcache dirs are now warm) so the traced runs below
      # are true no-ops, and a fresh cold build is forced explicitly where
      # the cold/no-op distinction itself is the thing being checked.
      - name: Trace a cold and a true-no-op rust-heavy-workspace build (issue #19 Experiment 1)
        run: |
          rm -rf fixtures/rust-heavy-workspace/target
          cargo run -q -p laminaria-cli -- run \
            --workload-id rust-heavy-workspace --scenario-id cold-build --runs-root runs --json \
            -- cargo build --manifest-path fixtures/rust-heavy-workspace/Cargo.toml --workspace \
            > /tmp/cold-run.json
          cargo run -q -p laminaria-cli -- run \
            --workload-id rust-heavy-workspace --scenario-id true-noop --runs-root runs --json \
            -- cargo build --manifest-path fixtures/rust-heavy-workspace/Cargo.toml --workspace \
            > /tmp/noop-run.json
          COLD_SUCCESS=$(jq -r '.result.success' /tmp/cold-run.json)
          NOOP_SUCCESS=$(jq -r '.result.success' /tmp/noop-run.json)
          COLD_CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/cold-run.json)
          NOOP_CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/noop-run.json)
          echo "cold build user_cpu_seconds=$COLD_CPU, true-noop user_cpu_seconds=$NOOP_CPU"
          [ "$COLD_SUCCESS" = "true" ] || { echo "cold build Run should have succeeded"; exit 1; }
          [ "$NOOP_SUCCESS" = "true" ] || { echo "no-op build Run should have succeeded"; exit 1; }
          [ "$COLD_CPU" != "null" ] && [ "$NOOP_CPU" != "null" ] || {
            echo "resource usage must not be missing on a supported (Linux/macOS) runner"; exit 1;
          }
          awk -v cold="$COLD_CPU" -v noop="$NOOP_CPU" 'BEGIN { exit !(cold > noop) }' || {
            echo "expected the cold build's cumulative CPU (${COLD_CPU}s) to clearly exceed the true-no-op rebuild's (${NOOP_CPU}s) -- if it doesn't, the tracer isn't actually attributing rustc/linker descendant work to the traced root command"
            exit 1
          }

      - name: Trace a cold nim-heavy-workspace build (issue #19 Experiment 2)
        run: |
          rm -rf fixtures/nim-heavy-workspace/nimcache fixtures/nim-heavy-workspace/fixture_out
          cargo run -q -p laminaria-cli -- run \
            --workload-id nim-heavy-workspace --scenario-id cold-build --runs-root runs --json \
            -- nim c --nimcache:fixtures/nim-heavy-workspace/nimcache \
               -o:fixtures/nim-heavy-workspace/fixture_out fixtures/nim-heavy-workspace/src/fixture.nim \
            > /tmp/nim-run.json
          fixtures/nim-heavy-workspace/fixture_out
          SUCCESS=$(jq -r '.result.success' /tmp/nim-run.json)
          CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/nim-run.json)
          [ "$SUCCESS" = "true" ] || { echo "nim build Run should have succeeded"; exit 1; }
          [ "$CPU" != "null" ] || { echo "resource usage must not be missing on a supported (Linux/macOS) runner"; exit 1; }
          echo "nim build user_cpu_seconds=$CPU"

      # Issue #19 Experiment 5: a failed child process must not discard
      # partial evidence. Checked here rather than only in laminaria-run's
      # own unit tests, so the CLI's exit-code propagation is covered too.
      - name: Trace a failing command and confirm evidence is preserved (issue #19 Experiment 5)
        run: |
          set +e
          cargo run -q -p laminaria-cli -- run \
            --workload-id ci-smoke --scenario-id deliberate-failure --runs-root runs --json \
            -- sh -c 'echo deliberate failure 1>&2; exit 5' \
            > /tmp/failure-run.json
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 1 ]; then
            echo "expected laminaria run to exit 1 (traced command failed), got $STATUS"
            exit 1
          fi
          SUCCESS=$(jq -r '.result.success' /tmp/failure-run.json)
          CODE=$(jq -r '.result.root_exit_status.code' /tmp/failure-run.json)
          CPU=$(jq -r '.process_trace.processes[0].resource_usage.user_cpu_seconds' /tmp/failure-run.json)
          [ "$SUCCESS" = "false" ] || { echo "expected result.success=false"; exit 1; }
          [ "$CODE" = "5" ] || { echo "expected root_exit_status.code=5, got $CODE"; exit 1; }
          [ "$CPU" != "null" ] || { echo "resource usage must be captured even for a failed command"; exit 1; }
          echo "failure evidence preserved: exit code and resource usage both present"

      # Issue #19: "raw evidence can regenerate summary.json without
      # rerunning the workload" -- exercised end-to-end via the CLI
      # against a real written Run, not just laminaria-run's own tests.
      - name: Regenerate summary.json from an already-written Run (issue #19)
        run: |
          RUN_ID=$(jq -r '.run_id' /tmp/nim-run.json)
          rm "runs/$RUN_ID/summary.json"
          cargo run -q -p laminaria-cli -- regenerate-summary --runs-root runs "$RUN_ID" > /tmp/regenerated-summary.json
          diff <(jq -S . "runs/$RUN_ID/summary.json") <(jq -S . /tmp/regenerated-summary.json)
          echo "regenerated summary.json matches the file laminaria-cli wrote on disk"

      - name: Build rust-nim-c-abi-baseline fixture
        run: |
          cd fixtures/rust-nim-c-abi-baseline/rust-bin
          cargo run

      - name: Build wide-parallel-graph fixture
        run: |
          cd fixtures/wide-parallel-graph
          cargo build --workspace
          cargo test --workspace
          cargo run -q -p aggregator

      - name: Build deep-critical-path-graph fixture
        run: |
          cd fixtures/deep-critical-path-graph
          cargo build --workspace
          cargo test --workspace
          cargo run -q -p fixture-bin

      - name: Build mixed-rust-nim-executable fixture
        run: |
          cd fixtures/mixed-rust-nim-executable/rust-bin
          cargo run

      - name: Build boundary-heavy-workload fixture
        run: |
          cd fixtures/boundary-heavy-workload/rust-bin
          cargo run

      - name: Build unchanged-noop-workspace fixture
        run: |
          cd fixtures/unchanged-noop-workspace
          cargo test
          cargo run
          cargo build

      - name: Build incremental-semantic-edit fixture
        run: |
          cd fixtures/incremental-semantic-edit
          cargo build --workspace
          cargo test --workspace
          cargo run -q -p aggregator
          scripts/apply-edit.sh
          cargo run -q -p aggregator
          scripts/revert-edit.sh
          cargo run -q -p aggregator
          git diff --exit-code crates/leaf-b/src/lib.rs

      - name: Build direct-native-link fixture
        run: |
          cd fixtures/direct-native-link
          cargo test --manifest-path rust-lib/Cargo.toml
          ./build.sh

      # Issue #4 Layer 5's required comparison: "conventional C ABI
      # baseline" (a cbindgen-generated header as the single source of
      # truth for the boundary) against the direct route just built
      # above, against the *same* unmodified rust-lib static library.
      # Run right after the direct route so both binaries being compared
      # for size exist from the same CI run. See
      # fixtures/direct-native-link/NOTES.md's "c-abi-baseline/" section
      # for what evidence this produces and its limits (whole-binary
      # size is confounded by unequal workload coverage between the two
      # main.nim files; call-overhead is not -- see the disassembly
      # comparison there).
      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build and run the direct-native-link c-abi-baseline comparison
        run: |
          cd fixtures/direct-native-link/c-abi-baseline
          ./build.sh

      # Issue #4 Layer 4, previously entirely untested: what happens
      # when a Rust function panics while called from Nim? Expected,
      # deterministic outcome verified below: SIGABRT (134) -- a plain
      # `extern "C" fn` is a "cannot unwind" boundary, confirmed by
      # rust-lib's own unit tests too. See panic-experiment/main.nim
      # and fixtures/direct-native-link/NOTES.md.
      - name: Build and run the direct-native-link panic-boundary experiment
        run: |
          cd fixtures/direct-native-link/panic-experiment
          cargo build --release --manifest-path ../rust-lib/Cargo.toml
          nim c --nimcache:nimcache --passL:"-L../rust-lib/target/release -lrustlib" -o:main main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 134 ]; then
            echo "main aborted via SIGABRT (134) -- the expected, deterministic panic-across-extern-C-boundary behavior"
          else
            echo "main exited with unexpected status $STATUS -- expected SIGABRT (134), investigate"
            exit 1
          fi

      # Issue #4 Layer 4, also previously untested: does calling into
      # Rust's extern "C" functions work from an OS thread *Nim*
      # created (not one Rust's own std::thread::spawn set up)? See
      # thread-experiment/main.nim and NOTES.md.
      - name: Build and run the direct-native-link thread-boundary experiment
        run: |
          cd fixtures/direct-native-link/thread-experiment
          cargo build --release --manifest-path ../rust-lib/Cargo.toml
          nim c --threads:on --nimcache:nimcache --passL:"-L../rust-lib/target/release -lrustlib" -o:main main.nim
          ./main

      # Issue #4 Layer 3/4, reverse direction: Rust calling a
      # Nim-provided function pointer (the "closures/function values"
      # matrix class, with no captured environment), and what happens
      # when a Nim exception is raised inside that callback while a
      # Rust stack frame is live. Expected, deterministic outcome
      # verified below: exit code 1 with a clean, correctly-attributed
      # "unhandled exception" report -- not a crash, not silent
      # corruption. See callback-experiment/main.nim and NOTES.md.
      - name: Build and run the direct-native-link callback-boundary experiment
        run: |
          cd fixtures/direct-native-link/callback-experiment
          cargo build --release --manifest-path ../rust-lib/Cargo.toml
          nim c --nimcache:nimcache --passL:"-L../rust-lib/target/release -lrustlib" -o:main main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 1 ]; then
            echo "main exited with status 1 -- the expected, clean unhandled-exception report"
          else
            echo "main exited with unexpected status $STATUS -- expected 1, investigate"
            exit 1
          fi

  # Issue #4's genuinely-open question, not #11's: every fixture above
  # uses `nim c`, which always produces native code via a generated-C
  # intermediate -- even with no header file, that route's ABI/symbol
  # shape is fundamentally C's. nlvm (https://github.com/arnetheduck/nlvm)
  # is Nim's existing LLVM-direct backend: no C source, no C compiler,
  # anywhere in the path. Isolated in its own job (not the `rust` matrix
  # above) because it's exploratory -- a failure here must not fail-fast
  # cancel the main fixture suite. Only Linux/Windows release binaries
  # exist upstream; no macOS build was attempted (nlvm's own build
  # pins/builds its own exact LLVM revision rather than reusing the
  # host's, and bootstraps its own Nim from C sources -- a large, risky
  # time investment for this session, versus this job's already-working
  # Linux binary).
  nlvm-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download nlvm (Linux continuous build)
        run: |
          curl -fLo nlvm.tar.xz https://github.com/arnetheduck/nlvm/releases/download/continuous/nlvm-linux-a9c3397.tar.xz
          tar xf nlvm.tar.xz
          find . -maxdepth 4 -iname 'nlvm*' -type f -exec chmod +x {} \;
          find . -maxdepth 4 -iname 'nlvm*' -type f

      - name: nlvm --version
        run: |
          NLVM_BIN=$(find "$PWD" -maxdepth 4 -iname 'nlvm' -type f -perm -u+x | head -1)
          echo "NLVM_BIN=$NLVM_BIN" >> "$GITHUB_ENV"
          "$NLVM_BIN" --version

      - name: Compile and run a trivial Nim program via nlvm (no C anywhere)
        run: |
          rm -rf ~/.cache/nim/hello_d # start from a clean per-project cache
          cd fixtures/direct-native-link/nlvm-experiment
          "$NLVM_BIN" c hello.nim
          ./hello
          echo "--- confirming nlvm's own build cache for THIS project contains no .c file ---"
          # Scope this to nlvm's actual per-project build cache
          # (~/.cache/nim/hello_d/, confirmed from the linker invocation
          # above), not nlvm's whole install tree -- that tree ships
          # unrelated bundled .c files of its own (Windows mingw COM
          # interop stubs, Nim stdlib's linenoise.c) that have nothing
          # to do with compiling hello.nim and would be a false positive.
          if [ -n "$(find ~/.cache/nim/hello_d -iname '*.c' 2>/dev/null)" ]; then
            echo "found .c file(s) in nlvm's build cache for hello.nim -- contradicts the C-free claim"
            find ~/.cache/nim/hello_d -iname '*.c'
            exit 1
          fi
          echo "no .c files found in nlvm's build cache for hello.nim (expected)"
          echo "cache contents for reference:"
          find ~/.cache/nim/hello_d -type f

      # The actual apples-to-apples comparison the smoke test above set
      # up for: the same rust-lib static library nim-bin/main.nim links
      # against (rust_transform, Point layout probe, by-value round
      # trip, pointer mutation), this time linked from Nim compiled via
      # nlvm instead of `nim c` -- same Rust artifact, different Nim
      # route, so any difference in outcome is attributable to the
      # Nim-side route alone.
      - name: Build rust-lib for the nlvm <-> Rust experiment
        run: cargo build --release --manifest-path fixtures/direct-native-link/rust-lib/Cargo.toml

      - name: Compile and run the nlvm <-> Rust direct-link experiment
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/nlvm-experiment
          "$NLVM_BIN" c --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          # ./main's last block is a *diagnosed, documented* nlvm ABI
          # bug (see NOTES.md): a by-value struct argument followed by
          # more parameters segfaults (exit 139) under nlvm's current
          # small-struct handling. Every block before it already
          # completed and printed its result by the time this happens.
          # Treat that specific, already-understood crash as an
          # expected outcome here, not a CI failure -- while still
          # failing on any *other*, unexplained exit code, which would
          # be a real regression worth investigating.
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 139 ]; then
            echo "main exited via SIGSEGV (139) -- the known, diagnosed nlvm struct-argument ABI bug (see NOTES.md), not a new failure"
          elif [ "$STATUS" -ne 0 ]; then
            echo "main exited with unexpected status $STATUS -- not the known SIGSEGV, investigate"
            exit 1
          fi
          echo "--- confirming no .c file in nlvm's build cache for THIS project ---"
          if [ -n "$(find ~/.cache/nim/main_d -iname '*.c' 2>/dev/null)" ]; then
            echo "found .c file(s) -- contradicts the C-free claim"
            find ~/.cache/nim/main_d -iname '*.c'
            exit 1
          fi
          echo "no .c files found (expected)"
          find ~/.cache/nim/main_d -type f
          echo "--- symbol resolution trail, same methodology as NOTES.md's nim-bin evidence ---"
          nm main | grep -E 'rust_transform|rust_point' || true

      # Cross-route confirmation of the panic-boundary finding above --
      # this is a Rust-side unwind-ABI behavior, not expected to be
      # route-dependent, but checked directly rather than assumed given
      # how many other things turned out to differ on nlvm today.
      - name: Build and run the panic-boundary experiment via nlvm
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/panic-experiment
          "$NLVM_BIN" c --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 134 ]; then
            echo "main aborted via SIGABRT (134) on the nlvm route too -- matches the nim c route"
          else
            echo "main exited with unexpected status $STATUS on the nlvm route -- expected SIGABRT (134), investigate"
            exit 1
          fi

      # Cross-route confirmation of the thread-boundary experiment too.
      - name: Build and run the thread-boundary experiment via nlvm
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/thread-experiment
          "$NLVM_BIN" c --threads:on --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          ./main

      # Cross-route confirmation of the callback-boundary experiment.
      # Route-DIVERGENT, verified directly rather than assumed to match
      # nim c: nlvm implements Nim's exceptions with real LLVM-level
      # stack unwinding (a `personality` function on generated
      # functions -- visible in rust-nim-llvm-lto-compatibility's own
      # merged IR), unlike nim c's default --exceptions:goto, which
      # never unwinds at all. A Nim exception crossing back through the
      # Rust extern "C" stack frame therefore hits nlvm's real unwinder,
      # which hits the same "cannot unwind past extern C" protection
      # that made rust_panics abort earlier -- so nlvm reports SIGABRT
      # (134) here where nim c cleanly exits 1. See NOTES.md.
      - name: Build and run the callback-boundary experiment via nlvm
        run: |
          rm -rf ~/.cache/nim/main_d
          cd fixtures/direct-native-link/callback-experiment
          "$NLVM_BIN" c --passL:"-L../rust-lib/target/release -lrustlib" main.nim
          set +e
          ./main
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 134 ]; then
            echo "main aborted via SIGABRT (134) on the nlvm route -- diverges from nim c's clean exit(1), a real route-dependent finding, not a bug (see NOTES.md)"
          else
            echo "main exited with unexpected status $STATUS on the nlvm route -- expected SIGABRT (134), investigate"
            exit 1
          fi

      # #11's own fixture (not #4's investigation, though it reuses this
      # job's nlvm download): does Rust's own LLVM IR and Nim's own LLVM
      # IR (via nlvm) merge into one module with llvm-link, before
      # either side reaches native codegen? See
      # fixtures/rust-nim-llvm-lto-compatibility/NOTES.md. Needs
      # llvm-link/opt/llvm-dis matching nlvm's pinned LLVM version
      # (checked directly to be 22.1.8, matching this project's own
      # pinned rustc's bundled LLVM exactly) -- installed here via
      # apt.llvm.org's own installer script, the standard route.
      - name: Install LLVM 22 tools (llvm-link/opt/llvm-dis) matching nlvm's pinned version
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          echo "LLVM_LINK_BIN=$(command -v llvm-link-22)" >> "$GITHUB_ENV"
          echo "OPT_BIN=$(command -v opt-22)" >> "$GITHUB_ENV"
          echo "LLVM_DIS_BIN=$(command -v llvm-dis-22)" >> "$GITHUB_ENV"
          echo "LLC_BIN=$(command -v llc-22)" >> "$GITHUB_ENV"

      - name: Build rust-nim-llvm-lto-compatibility fixture
        run: |
          cd fixtures/rust-nim-llvm-lto-compatibility
          ./build.sh

  # Exercises the "container" EnvironmentFingerprint class from a clean,
  # native (non-Rosetta) environment — see docker/bootstrap.Dockerfile for
  # why this is a bootstrap/correctness check, not a performance baseline.
  docker-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap image
        run: docker build -f docker/bootstrap.Dockerfile -t laminaria-bootstrap .

      - name: doctor inside the container
        run: docker run --rm laminaria-bootstrap doctor
