name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt/clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: doctor (environment fingerprint, informational)
        run: cargo run -p laminaria-cli -- doctor
        continue-on-error: true

  # Exercises the "container" EnvironmentFingerprint class from a clean,
  # native (non-Rosetta) environment — see docker/bootstrap.Dockerfile for
  # why this is a bootstrap/correctness check, not a performance baseline.
  docker-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap image
        run: docker build -f docker/bootstrap.Dockerfile -t laminaria-bootstrap .

      - name: doctor inside the container
        run: docker run --rm laminaria-bootstrap doctor
