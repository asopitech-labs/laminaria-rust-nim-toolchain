name: Reference project setup

on:
  push:
    branches: [main]
    paths:
      - reference-projects.lock.json
      - scripts/reference_projects.py
      - scripts/tests/**
      - .github/workflows/reference-projects.yml
  pull_request:
    paths:
      - reference-projects.lock.json
      - scripts/reference_projects.py
      - scripts/tests/**
      - .github/workflows/reference-projects.yml
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pinned clone setup without network access
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate and list the checked-in lock
        run: python scripts/reference_projects.py list
