name: Reference project setup

# Automatic CI/CD is suspended for the current research phase (owner
# decision, 2026-09-15) -- see ci.yml's own header for the full
# rationale. `workflow_dispatch` is kept for manual runs.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pinned clone setup without network access
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate and list the checked-in lock
        run: python scripts/reference_projects.py list
